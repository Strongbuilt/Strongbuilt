<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Strong Built</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme-config.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(239, 191, 4, 0.06), transparent 60%),
        linear-gradient(180deg, #1a1718 0%, #141112 100%);
      background-attachment: fixed;
      color: #EEEEEE;
      min-height: 100vh;
    }
    h1,h2,h3,h4,.font-heading,button,input,select,textarea,label { font-family: 'Barlow Condensed', sans-serif; }

    /* ─── INPUTS ─── */
    input,select,textarea {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      color: #EEEEEE;
      transition: border-color .2s, box-shadow .2s, background .2s;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      border-radius: 3px;
    }
    input::placeholder, textarea::placeholder { color: rgba(170, 170, 170,0.4); }
    input:hover:not(:focus), select:hover:not(:focus), textarea:hover:not(:focus) {
      border-color: rgba(239, 191, 4,0.25);
      background: rgba(255,255,255,0.045);
    }
    input:focus,select:focus,textarea:focus {
      outline: none; border-color: #EFBF04;
      box-shadow: 0 0 0 3px rgba(239, 191, 4,0.15);
      background: rgba(255,255,255,0.055);
    }
    input.invalid,select.invalid,textarea.invalid {
      border-color: #f87171;
      box-shadow: 0 0 0 3px rgba(248,113,113,0.18);
    }
    /* Native select option list — force dark background so options are legible */
    select option {
      background-color: #1a1718;
      color: #EEEEEE;
      padding: 8px;
    }
    select option:hover,
    select option:checked {
      background-color: #EFBF04;
      color: #1a1718;
    }
    label {
      display: block; font-size: .6rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .22em;
      color: #EFBF04; margin-bottom: .4rem;
    }
    .field-error {
      font-size: .65rem; color: #f87171;
      margin-top: .3rem; display: none; letter-spacing: .05em;
      font-weight: 600;
    }
    .field-error.is-visible { display: block; }

    /* ─── GLASS SURFACE ─── */
    .glass {
      background: linear-gradient(155deg, rgba(42, 38, 39, 0.55), rgba(20, 18, 19, 0.65));
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.06);
    }

    /* ─── BUTTONS ─── */
    .btn {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700; text-transform: uppercase;
      letter-spacing: .16em; transition: all .25s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex; align-items: center; justify-content: center;
      gap: .45rem; border-radius: 3px;
      position: relative; overflow: hidden;
    }
    .btn-primary {
      background: linear-gradient(155deg, #EFBF04, #EFBF04);
      color: #1a1718;
      border: 1px solid rgba(239, 191, 4, 0.8);
      box-shadow: 0 2px 12px -2px rgba(239, 191, 4, 0.4), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px -4px rgba(239, 191, 4, 0.55), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: .3; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-outline {
      background: rgba(255,255,255,0.02);
      color: #EEEEEE;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-outline:hover {
      border-color: rgba(239, 191, 4, 0.6);
      color: #EFBF04;
      background: rgba(239, 191, 4, 0.05);
    }
    .btn-outline:disabled { opacity: .3; cursor: not-allowed; }
    .btn-danger {
      background: transparent; color: #f87171;
      border: 1px solid rgba(248,113,113,0.25);
    }
    .btn-danger:hover {
      background: rgba(248,113,113,0.08);
      border-color: rgba(248,113,113,0.6);
    }

    /* ─── TABS — pill active state with count ─── */
    .tab {
      padding: .55rem 1rem;
      font-size: .65rem; font-weight: 700;
      letter-spacing: .22em; text-transform: uppercase;
      color: rgba(170, 170, 170,0.7);
      border: 1px solid transparent;
      border-radius: 999px;
      transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      display: inline-flex; align-items: center; gap: .5rem;
      position: relative;
    }
    .tab:hover { color: #EEEEEE; background: rgba(255,255,255,0.03); }
    .tab.is-active {
      color: #EFBF04;
      background: linear-gradient(155deg, rgba(239, 191, 4, 0.15), rgba(239, 191, 4, 0.05));
      border-color: rgba(239, 191, 4, 0.4);
      box-shadow: 0 2px 12px -4px rgba(239, 191, 4, 0.3);
    }
    .tab i { font-size: .75rem; opacity: .75; }
    .tab.is-active i { opacity: 1; }
    .tab-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; padding: 0 5px;
      font-size: .55rem; font-weight: 700;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      letter-spacing: 0;
    }
    .tab.is-active .tab-count {
      background: rgba(239, 191, 4, 0.25);
      color: #EFBF04;
    }

    /* ─── LIST ITEMS — tcard premium ─── */
    .list-item {
      position: relative;
      padding: 0.85rem 1rem;
      background: linear-gradient(155deg, rgba(42, 38, 39, 0.4), rgba(20, 18, 19, 0.5));
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
      transition: transform .3s cubic-bezier(0.16, 1, 0.3, 1), border-color .25s, box-shadow .3s;
    }
    .list-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, transparent, #EFBF04, transparent);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform .35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .list-item:hover {
      border-color: rgba(239, 191, 4, 0.3);
      transform: translateX(4px);
      box-shadow: 0 6px 20px -8px rgba(0,0,0,0.6), 0 0 0 1px rgba(239, 191, 4, 0.15);
    }
    .list-item:hover::before { transform: scaleY(1); }
    .list-item.is-editing {
      border-color: rgba(239, 191, 4, 0.5);
      background: linear-gradient(155deg, rgba(239, 191, 4, 0.1), rgba(42, 38, 39, 0.5));
      box-shadow: 0 8px 28px -8px rgba(0,0,0,0.6), 0 0 0 1px rgba(239, 191, 4, 0.3);
    }
    .list-item.is-editing::before { transform: scaleY(1); }
    .list-item.dragging { opacity: .4; transform: scale(0.98); }
    .list-item.drag-over-top { border-top: 2px solid #EFBF04; transform: translateX(4px) translateY(4px); }
    .list-item.drag-over-bottom { border-bottom: 2px solid #EFBF04; transform: translateX(4px) translateY(-4px); }

    .drag-handle {
      cursor: grab; opacity: .25;
      transition: opacity .2s, color .2s;
      color: #AAAAAA;
    }
    .list-item:hover .drag-handle { opacity: .7; }
    .drag-handle:hover { opacity: 1 !important; color: #EFBF04; }
    .drag-handle:active { cursor: grabbing; }

    /* ─── BADGES ─── */
    .badge {
      font-size: .52rem; font-weight: 700; padding: 3px 8px;
      text-transform: uppercase; letter-spacing: .15em;
      border-radius: 999px;
      display: inline-flex; align-items: center; gap: 3px;
      white-space: nowrap;
    }
    .badge-resi { background: rgba(239, 191, 4, 0.2); color: #EFBF04; border: 1px solid rgba(239, 191, 4, 0.45); }
    .badge-comm { background: rgba(255,140,0,0.15); color: #FF8C00; border: 1px solid rgba(255,140,0,0.25); }
    .badge-infra { background: rgba(192,192,192,0.12); color: #C0C0C0; border: 1px solid rgba(192,192,192,0.2); }
    .badge-ongoing { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
    .badge-ongoing::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%;
      background: #4ade80; box-shadow: 0 0 6px #4ade80;
      animation: pulse-dot 2s infinite;
    }
    .badge-completed { background: rgba(255,255,255,0.04); color: #AAAAAA; border: 1px solid rgba(255,255,255,0.1); }
    .badge-featured {
      background: linear-gradient(155deg, rgba(239, 191, 4,0.22), rgba(239, 191, 4,0.08));
      color: #EFBF04; border: 1px solid rgba(239, 191, 4,0.4);
    }

    /* ─── STATS STRIP (above list) ─── */
    .stats-strip {
      display: flex; gap: 0.5rem 1.25rem; flex-wrap: wrap;
      padding: 0.65rem 0.25rem 0;
      font-size: .6rem; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase;
      color: #AAAAAA;
    }
    .stats-strip .stat-num { color: #EFBF04; font-family: 'Oswald', sans-serif; font-size: 0.85rem; margin-right: 4px; letter-spacing: 0; }

    /* ─── TOAST ─── */
    .toast {
      position: fixed; bottom: 1.5rem; left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: .85rem 1.4rem;
      background: linear-gradient(155deg, rgba(30, 26, 27, 0.98), rgba(20, 18, 19, 0.98));
      border: 1px solid rgba(239, 191, 4, 0.5);
      color: #EEEEEE;
      border-radius: 8px;
      z-index: 10000;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 40px -8px rgba(0,0,0,0.8), 0 0 24px -8px rgba(239, 191, 4, 0.25);
      opacity: 0; pointer-events: none;
      transition: all .35s cubic-bezier(0.16,1,0.3,1);
      display: flex; align-items: center; gap: .75rem;
      max-width: 90vw;
    }
    .toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .toast::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: #EFBF04; box-shadow: 0 0 10px currentColor;
    }
    .toast.success { border-color: rgba(74,222,128,0.6); color: #4ade80; }
    .toast.success::before { background: #4ade80; }
    .toast.error { border-color: rgba(248,113,113,0.6); color: #f87171; }
    .toast.error::before { background: #f87171; }
    .toast.warn { border-color: rgba(239, 191, 4,0.6); color: #EFBF04; }
    .toast-action {
      text-decoration: none; cursor: pointer; font-weight: 700;
      padding: 3px 8px; border-radius: 3px;
      background: rgba(239, 191, 4,0.15);
      color: #EFBF04;
      border: 1px solid rgba(239, 191, 4,0.3);
      transition: all .2s;
    }
    .toast-action:hover { background: rgba(239, 191, 4,0.3); }

    /* ─── DIRTY INDICATOR — softer amber pulse instead of alarming red ─── */
    .dirty-dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: #EFBF04;
      animation: pulse-dot 2.5s ease-in-out infinite;
      box-shadow: 0 0 6px rgba(239, 191, 4, 0.6);
    }
    @keyframes pulse-dot { 0%,100%{opacity:1}50%{opacity:.5} }

    /* ─── EDITOR BREADCRUMB ─── */
    .editor-crumb {
      font-size: .55rem; font-weight: 700;
      letter-spacing: .3em; text-transform: uppercase;
      color: #EFBF04;
      margin-bottom: .25rem;
      display: flex; align-items: center; gap: .4rem;
    }
    .editor-crumb i { font-size: .5rem; opacity: .5; }

    /* ─── FORM SECTIONS ─── */
    .form-section {
      padding-top: 1rem;
      margin-top: 0.5rem;
      border-top: 1px dashed rgba(255,255,255,0.05);
    }
    .form-section:first-child { padding-top: 0; margin-top: 0; border-top: none; }

    /* ─── MAP PICKER ─── */
    #pickerMap { height: 240px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
    .leaflet-container { background: #1a1a1a; font-family: 'Inter', sans-serif; }
    .leaflet-control-zoom a { background: rgba(0,0,0,0.85) !important; color: #EFBF04 !important; border: 1px solid rgba(239, 191, 4,0.25) !important; }
    .leaflet-popup-content-wrapper { background: rgba(20,18,19,0.97); color: #EEEEEE; border: 1px solid rgba(239, 191, 4,0.3); border-radius: 4px; }
    .geo-result {
      padding: .5rem .75rem; cursor: pointer;
      font-size: .72rem; border-bottom: 1px solid rgba(255,255,255,0.05);
      color: #EEEEEE; transition: background .2s;
    }
    .geo-result:hover { background: rgba(239, 191, 4,0.1); }
    .context-marker { background: transparent !important; border: none !important; }
    .context-marker-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(239, 191, 4, 0.85); border: 1px solid #1a1718; box-shadow: 0 0 8px rgba(239, 191, 4, 0.6); }

    /* ─── IMAGE PREVIEW ─── */
    .img-preview {
      display: none;
      width: 100%; height: 140px; object-fit: cover;
      border-radius: 4px;
      border: 1px solid rgba(239, 191, 4,0.3);
      margin-top: .5rem;
    }
    .img-preview.is-visible { display: block; }
    .img-drop {
      border: 1px dashed rgba(239, 191, 4,0.3);
      padding: .75rem; border-radius: 4px;
      text-align: center; font-size: .7rem;
      color: #AAAAAA; margin-top: .5rem;
      transition: all .25s;
    }
    .img-drop.is-dragover { border-color: #EFBF04; background: rgba(239, 191, 4,0.08); color: #EFBF04; }

    /* ─── MOBILE DRAWER ─── */
    @media (max-width: 1023px) {
      .editor-panel {
        position: fixed !important;
        inset: 0;
        z-index: 50;
        background: #1a1718;
        transform: translateY(100%);
        transition: transform .35s cubic-bezier(0.16,1,0.3,1);
        overflow-y: auto;
      }
      .editor-panel.is-open { transform: translateY(0); }
      .editor-backdrop {
        position: fixed; inset: 0; z-index: 49;
        background: rgba(0,0,0,0.6);
        opacity: 0; pointer-events: none;
        transition: opacity .3s;
      }
      .editor-backdrop.is-open { opacity: 1; pointer-events: auto; }
      .editor-close-mobile { display: inline-flex !important; }
    }
    .editor-close-mobile { display: none; }

    /* Keyboard shortcut hint */
    .kbd {
      display: inline-block; padding: 1px 5px;
      font-size: .6rem; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 3px; letter-spacing: .02em;
      font-family: monospace;
    }

    /* Progress bar for Active Projects form */
    .progress-slider { accent-color: #EFBF04; }
  </style>
</head>
<body class="min-h-screen">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 glass border-b border-clay-border">
    <div class="container mx-auto px-4 md:px-6 py-3 md:py-4 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 md:gap-4 min-w-0">
        <img src="assets/Logo/Strongbuilt.png" alt="Strong Built" class="h-10 md:h-12 w-auto shrink-0">
        <div class="min-w-0">
          <h1 class="text-base md:text-xl font-bold uppercase tracking-wider leading-none truncate">Admin <span class="text-brand-gold">Studio</span></h1>
          <p class="text-[10px] text-clay-faint uppercase tracking-widest mt-1 flex items-center">
            <span id="currentTabLabel">Projects</span>
            <span id="dirtyIndicator" class="hidden flex items-center"><span class="dirty-dot"></span><span class="ml-2 text-red-400">Unsaved</span></span>
          </p>
        </div>
      </div>
      <div class="flex items-center gap-1 md:gap-2">
        <button id="undoBtn" class="btn btn-outline p-2 md:px-3 md:py-2 text-[10px] rounded-sm" title="Undo (Ctrl+Z)" aria-label="Undo last change"><i class="fas fa-undo"></i><span class="hidden md:inline">Undo</span></button>
        <button id="redoBtn" class="btn btn-outline p-2 md:px-3 md:py-2 text-[10px] rounded-sm" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><i class="fas fa-redo"></i><span class="hidden md:inline">Redo</span></button>
        <button id="importBtn" class="btn btn-outline px-3 py-2 text-[10px] rounded-sm" title="Import data file"><i class="fas fa-upload"></i><span class="hidden md:inline">Import</span></button>
        <button id="downloadBtn" class="btn btn-primary px-3 md:px-4 py-2 text-[10px] rounded-sm" title="Download current tab's data file (Ctrl+S)"><i class="fas fa-download"></i><span class="hidden md:inline">Download</span></button>
      </div>
    </div>
    <!-- TABS -->
    <nav class="container mx-auto px-4 md:px-6 flex gap-1.5 overflow-x-auto pb-3 pt-1" aria-label="Admin sections">
      <button class="tab is-active" data-type="projects"><i class="fas fa-building"></i>Projects<span class="tab-count" data-count="projects">0</span></button>
      <button class="tab" data-type="testimonials"><i class="fas fa-quote-left"></i>Testimonials<span class="tab-count" data-count="testimonials">0</span></button>
      <button class="tab" data-type="timeline"><i class="fas fa-timeline"></i>Timeline<span class="tab-count" data-count="timeline">0</span></button>
      <button class="tab" data-type="awards"><i class="fas fa-trophy"></i>Awards<span class="tab-count" data-count="awards">0</span></button>
      <button class="tab" data-type="activeProjects"><i class="fas fa-hard-hat"></i>Active<span class="tab-count" data-count="activeProjects">0</span></button>
      <button class="tab" data-type="siteInfo"><i class="fas fa-cog"></i>Site Info</button>
    </nav>
  </header>

  <input type="file" id="importFile" accept=".js,.json" class="hidden">

  <!-- MAIN LAYOUT -->
  <main class="container mx-auto px-4 md:px-6 py-4 md:py-8 grid lg:grid-cols-[1fr_440px] gap-4 md:gap-6">

    <!-- LEFT: LIST -->
    <section class="glass rounded-md p-3 md:p-5 relative">
      <div class="flex items-start justify-between mb-3 gap-3 flex-wrap">
        <div>
          <h2 id="listTitle" class="text-lg md:text-2xl font-bold uppercase tracking-tight">Projects</h2>
          <div id="statsStrip" class="stats-strip"></div>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
          <div class="relative">
            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-clay-faint text-[10px] pointer-events-none"></i>
            <input id="listSearch" type="search" placeholder="Search..." class="text-xs pl-8 pr-3 py-2 w-36 md:w-48">
          </div>
          <select id="sortBy" class="text-xs px-2 py-2">
            <option value="order">Custom order</option>
            <option value="title">Title A–Z</option>
            <option value="year-desc">Year ↓</option>
            <option value="year-asc">Year ↑</option>
            <option value="status">Status</option>
          </select>
          <button id="addNewBtn" class="btn btn-primary px-3 py-2 text-[10px]" title="New item (Ctrl+N)"><i class="fas fa-plus text-[9px]"></i><span class="hidden md:inline">New</span></button>
        </div>
      </div>
      <div id="listContainer" class="space-y-2" role="listbox" aria-label="Items in current tab"></div>
      <div id="emptyListMsg" class="hidden text-center py-12 text-clay-faint">
        <i class="fas fa-inbox text-3xl mb-3"></i>
        <p class="text-sm uppercase tracking-widest">No items yet</p>
        <p class="text-xs mt-1">Click <strong>New</strong> to start or Import a data file.</p>
      </div>
    </section>

    <!-- EDITOR BACKDROP (mobile only) -->
    <div id="editorBackdrop" class="editor-backdrop"></div>

    <!-- RIGHT: EDITOR -->
    <aside class="editor-panel glass rounded-md p-4 md:p-5 lg:sticky lg:top-[9rem] lg:self-start lg:max-h-[calc(100vh-10rem)] lg:overflow-y-auto">
      <div class="flex items-start justify-between mb-4">
        <div class="min-w-0 flex-1">
          <div id="editorCrumb" class="editor-crumb"><span>New Item</span></div>
          <h2 id="formTitle" class="text-lg md:text-xl font-bold uppercase tracking-tight truncate">New Item</h2>
        </div>
        <button id="editorCloseMobile" class="editor-close-mobile btn btn-outline p-2 text-[10px] rounded-sm ml-2" aria-label="Close editor"><i class="fas fa-times"></i></button>
      </div>
      <form id="itemForm" class="space-y-3" autocomplete="off" novalidate aria-labelledby="formTitle"></form>
      <div class="flex gap-2 pt-4 mt-4 border-t border-white/5">
        <button id="saveBtn" form="itemForm" type="submit" class="btn btn-primary flex-1 py-2.5 text-xs" title="Save (Ctrl+Enter)"><i class="fas fa-check text-[10px]"></i>Save</button>
        <button id="cancelBtn" type="button" class="btn btn-outline px-4 py-2.5 text-xs">Cancel</button>
        <button id="deleteBtn" type="button" class="btn btn-danger px-4 py-2.5 text-xs hidden" title="Delete (Ctrl+Del)"><i class="fas fa-trash text-[10px]"></i></button>
      </div>
      <div class="mt-4 pt-3 border-t border-white/5">
        <p class="text-[9px] text-clay-faint leading-relaxed flex flex-wrap items-center gap-x-3 gap-y-1.5 justify-end" id="shortcutHints">
          <span><span class="kbd"><span class="kbd-mod">Ctrl</span>+S</span> download</span>
          <span><span class="kbd"><span class="kbd-mod">Ctrl</span>+N</span> new</span>
          <span><span class="kbd"><span class="kbd-mod">Ctrl</span>+Z</span> undo</span>
          <span><span class="kbd">Esc</span> cancel</span>
        </p>
      </div>
    </aside>
  </main>

  <!-- TOAST -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- DATA FILES (pre-seed) -->
  <script src="projects-data.js"></script>
  <script src="testimonials-data.js"></script>
  <script src="timeline-data.js"></script>
  <script src="awards-data.js"></script>
  <script src="active-projects-data.js"></script>
  <script src="site-info.js"></script>

  <script>
  (function(){
    'use strict';

    // ════════════════════════════════════════════════════════════
    // DATA TYPE SCHEMAS
    // ════════════════════════════════════════════════════════════
    const TYPES = {
      projects: {
        label: 'Projects', icon: 'fa-building',
        storageKey: 'sb_admin_projects',
        filename: 'projects-data.js',
        constName: 'PROJECT_DATA',
        globalVar: 'PROJECT_DATA',
        isList: true, isKeyed: false,
        idField: 'id',
        columns: ['title', 'client', 'location'],
        features: { mapPicker: true, imageUpload: true, reorder: true, featured: true, search: ['title','client','location'] },
        fields: [
          { name: 'title', label: 'Title', type: 'text', required: true, placeholder: 'e.g. Monticello' },
          { name: 'id', label: 'ID (slug)', type: 'text', required: true, pattern: '^[a-z0-9-]+$', autoSlug: 'title', hint: 'lowercase, hyphens only — auto-generated from title' },
          { name: 'client', label: 'Client', type: 'text', required: true, placeholder: 'e.g. Lodha Group' },
          { name: 'year', label: 'Year', type: 'number', required: true, default: () => new Date().getFullYear(), min: 1990, max: 2099 },
          { name: 'category', label: 'Category', type: 'select', required: true, options: [['residential','Residential'],['commercial','Commercial'],['infrastructure','Infrastructure']] },
          { name: 'status', label: 'Status', type: 'select', required: true, options: [['ongoing','Ongoing'],['completed','Completed']] },
          { name: 'location', label: 'Location', type: 'text', required: true, placeholder: 'e.g. Bandra, Mumbai' },
          { name: 'area', label: 'Area', type: 'text', placeholder: 'e.g. 2.4 Lakh sq.ft' },
          { name: 'img', label: 'Image Path', type: 'image', placeholder: 'assets/Projects/monticello.jpg' },
          { name: 'coordinates', label: 'Coordinates (lat, lng)', type: 'coordinates', required: true, default: () => [19.0596, 72.8295] },
          { name: 'featured', label: 'Featured', type: 'checkbox' }
        ]
      },
      testimonials: {
        label: 'Testimonials', icon: 'fa-quote-left',
        storageKey: 'sb_admin_testimonials',
        filename: 'testimonials-data.js',
        constName: 'TESTIMONIALS_DATA',
        globalVar: 'TESTIMONIALS_DATA',
        isList: true, isKeyed: false,
        idField: 'id',
        columns: ['name', 'company'],
        features: { reorder: true, search: ['name','company','quote'] },
        fields: [
          { name: 'name', label: 'Name / Role', type: 'text', required: true, placeholder: 'e.g. Project Director' },
          { name: 'id', label: 'ID (slug)', type: 'text', required: true, autoSlug: 'name', pattern: '^[a-z0-9-]+$' },
          { name: 'company', label: 'Company', type: 'text', required: true, placeholder: 'e.g. Lodha Group' },
          { name: 'initials', label: 'Initials (2-3 chars)', type: 'text', required: true, maxlength: 3, placeholder: 'LG' },
          { name: 'quote', label: 'Quote', type: 'textarea', required: true, rows: 5, placeholder: 'What the client said...' }
        ]
      },
      timeline: {
        label: 'Timeline', icon: 'fa-timeline',
        storageKey: 'sb_admin_timeline',
        filename: 'timeline-data.js',
        constName: 'TIMELINE_DATA',
        globalVar: 'TIMELINE_DATA',
        isList: true, isKeyed: false,
        idField: 'id',
        columns: ['year', 'title'],
        features: { reorder: true, search: ['year','title','body'] },
        fields: [
          { name: 'year', label: 'Year', type: 'text', required: true, placeholder: '2024' },
          { name: 'id', label: 'ID (slug)', type: 'text', required: true, autoSlug: 'title', pattern: '^[a-z0-9-]+$' },
          { name: 'tag', label: 'Tag / Chapter Label', type: 'text', required: true, placeholder: 'The Beginning' },
          { name: 'kicker', label: 'Kicker (e.g. "Chapter One · Nov 2014")', type: 'text', required: true },
          { name: 'icon', label: 'FontAwesome Icon (e.g. fa-flag)', type: 'text', required: true, placeholder: 'fa-flag' },
          { name: 'title', label: 'Title', type: 'text', required: true },
          { name: 'body', label: 'Body', type: 'textarea', required: true, rows: 4 }
        ]
      },
      awards: {
        label: 'Awards', icon: 'fa-trophy',
        storageKey: 'sb_admin_awards',
        filename: 'awards-data.js',
        constName: 'AWARDS_DATA',
        globalVar: 'AWARDS_DATA',
        isList: true, isKeyed: true, // special: 2 sub-lists
        idField: 'id',
        groups: [
          { key: 'industry', label: 'Industry Awards' },
          { key: 'client', label: 'Client Recognition' }
        ],
        columns: ['year', 'title'],
        features: { reorder: true, search: ['title','issuer','description'] },
        fields: [
          { name: 'group', label: 'Group', type: 'select', required: true, options: [['industry','Industry'],['client','Client']] },
          { name: 'year', label: 'Year', type: 'text', required: true, placeholder: '2024' },
          { name: 'id', label: 'ID (slug)', type: 'text', required: true, autoSlug: 'title', pattern: '^[a-z0-9-]+$' },
          { name: 'issuer', label: 'Issuer (industry only)', type: 'text', placeholder: 'Construction World Magazine' },
          { name: 'meta', label: 'Meta (client only)', type: 'text', placeholder: '2019 · Safety Audit' },
          { name: 'icon', label: 'FontAwesome Icon', type: 'text', required: true, placeholder: 'fa-trophy' },
          { name: 'title', label: 'Title', type: 'text', required: true },
          { name: 'description', label: 'Description', type: 'textarea', required: true, rows: 3 }
        ]
      },
      activeProjects: {
        label: 'Active Projects', icon: 'fa-hard-hat',
        storageKey: 'sb_admin_active',
        filename: 'active-projects-data.js',
        constName: 'ACTIVE_PROJECTS_DATA',
        globalVar: 'ACTIVE_PROJECTS_DATA',
        isList: true, isKeyed: false,
        idField: 'id',
        columns: ['name', 'location'],
        features: { reorder: true, search: ['name','location'] },
        fields: [
          { name: 'name', label: 'Project Name', type: 'text', required: true },
          { name: 'id', label: 'ID (slug)', type: 'text', required: true, autoSlug: 'name', pattern: '^[a-z0-9-]+$' },
          { name: 'location', label: 'Location & Sector (e.g. "Pune · Mixed Use")', type: 'text', required: true },
          { name: 'progress', label: 'Progress %', type: 'slider', required: true, min: 0, max: 100, default: 50 },
          { name: 'eta', label: 'ETA (e.g. Q3 2026)', type: 'text', required: true }
        ]
      },
      siteInfo: {
        label: 'Site Info', icon: 'fa-cog',
        storageKey: 'sb_admin_site_info',
        filename: 'site-info.js',
        constName: 'SITE_INFO',
        globalVar: 'SITE_INFO',
        isList: false,
        fields: [
          { name: 'companyName', label: 'Company Name', type: 'text', required: true },
          { name: 'tagline', label: 'Tagline', type: 'text', required: true },
          { name: 'phonePrimary', label: 'Phone (Primary)', type: 'text', required: true },
          { name: 'phoneSecondary', label: 'Phone (Secondary)', type: 'text' },
          { name: 'email', label: 'Email', type: 'email', required: true },
          { name: 'emailAlt', label: 'Email (Alt)', type: 'email' },
          { name: 'whatsapp', label: 'WhatsApp Number (digits only, with country code)', type: 'text', required: true, placeholder: '919619875081' },
          { name: 'address', label: 'Address', type: 'textarea', required: true, rows: 3 },
          { name: 'social.linkedin', label: 'LinkedIn URL', type: 'url' },
          { name: 'social.instagram', label: 'Instagram URL', type: 'url' },
          { name: 'social.twitter', label: 'Twitter / X URL', type: 'url' }
        ]
      }
    };

    // ════════════════════════════════════════════════════════════
    // STATE
    // ════════════════════════════════════════════════════════════
    const state = {
      activeType: 'projects',
      data: {},        // { projects: [...], testimonials: [...], ... }
      editing: null,   // current item being edited OR null
      editingIndex: -1,
      undoStack: [],
      redoStack: [],
      dirty: new Set(), // which types have unsaved changes
      search: '',
      sortBy: 'order'
    };

    // ════════════════════════════════════════════════════════════
    // UTILITIES
    // ════════════════════════════════════════════════════════════
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    function slugify(s) {
      return String(s || '').toLowerCase().trim()
        .replace(/[^\w\s-]/g, '').replace(/[\s_-]+/g, '-').replace(/^-+|-+$/g, '');
    }
    function deepClone(v) { return JSON.parse(JSON.stringify(v)); }
    function getPath(obj, path) {
      return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
    }
    function setPath(obj, path, val) {
      const keys = path.split('.');
      let o = obj;
      while (keys.length > 1) {
        const k = keys.shift();
        if (o[k] == null || typeof o[k] !== 'object') o[k] = {};
        o = o[k];
      }
      o[keys[0]] = val;
    }

    function toast(msg, kind = 'info', opts = {}) {
      const el = $('#toast');
      el.className = 'toast is-visible ' + kind;
      const actionHTML = opts.action ? `<span class="toast-action" id="toastAction">${opts.action.label}</span>` : '';
      el.innerHTML = `<span>${msg}</span>${actionHTML}`;
      if (opts.action && opts.action.onClick) {
        const a = $('#toastAction');
        if (a) a.onclick = () => { opts.action.onClick(); el.classList.remove('is-visible'); };
      }
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('is-visible'), opts.duration || 4500);
    }

    function markDirty(type = state.activeType) {
      state.dirty.add(type);
      renderDirtyIndicator();
      autoSave(type);
    }
    function clearDirty(type = state.activeType) {
      state.dirty.delete(type);
      renderDirtyIndicator();
    }
    function renderDirtyIndicator() {
      $('#dirtyIndicator').classList.toggle('hidden', !state.dirty.has(state.activeType));
    }

    // ════════════════════════════════════════════════════════════
    // AUTO-SAVE (debounced)
    // ════════════════════════════════════════════════════════════
    const autoSaveTimers = {};
    let _quotaWarned = false;
    function autoSave(type) {
      clearTimeout(autoSaveTimers[type]);
      autoSaveTimers[type] = setTimeout(() => {
        try {
          localStorage.setItem(TYPES[type].storageKey, JSON.stringify(state.data[type]));
        } catch (e) {
          console.error('autoSave failed', e);
          // Surface storage failure so user knows work isn't persisted
          if (!_quotaWarned) {
            _quotaWarned = true;
            toast('Auto-save failed — download now to avoid losing work', 'error', { duration: 8000, action: { label: 'DOWNLOAD', onClick: download } });
          }
        }
      }, 400);
    }

    // ════════════════════════════════════════════════════════════
    // UNDO / REDO
    // ════════════════════════════════════════════════════════════
    function pushUndo(description) {
      state.undoStack.push({ type: state.activeType, snapshot: deepClone(state.data[state.activeType]), desc: description });
      if (state.undoStack.length > 50) state.undoStack.shift();
      state.redoStack = [];
      renderUndoButtons();
    }
    function undo() {
      if (!state.undoStack.length) return toast('Nothing to undo', 'warn');
      const entry = state.undoStack.pop();
      state.redoStack.push({ type: entry.type, snapshot: deepClone(state.data[entry.type]), desc: entry.desc });
      state.data[entry.type] = entry.snapshot;
      markDirty(entry.type);
      if (entry.type === state.activeType) { render(); closeEditor(); }
      toast('Undid: ' + entry.desc, 'info');
      renderUndoButtons();
    }
    function redo() {
      if (!state.redoStack.length) return toast('Nothing to redo', 'warn');
      const entry = state.redoStack.pop();
      state.undoStack.push({ type: entry.type, snapshot: deepClone(state.data[entry.type]), desc: entry.desc });
      state.data[entry.type] = entry.snapshot;
      markDirty(entry.type);
      if (entry.type === state.activeType) { render(); closeEditor(); }
      toast('Redid: ' + entry.desc, 'info');
      renderUndoButtons();
    }
    function renderUndoButtons() {
      $('#undoBtn').disabled = !state.undoStack.length;
      $('#redoBtn').disabled = !state.redoStack.length;
    }

    // ════════════════════════════════════════════════════════════
    // LOAD DATA (localStorage → global data file → empty)
    // ════════════════════════════════════════════════════════════
    function loadData() {
      Object.keys(TYPES).forEach(type => {
        const cfg = TYPES[type];
        try {
          const cached = localStorage.getItem(cfg.storageKey);
          if (cached) {
            state.data[type] = JSON.parse(cached);
            state.dirty.add(type);
            return;
          }
        } catch (e) { console.warn(`Bad cache for ${type}`); }

        const globalData = window[cfg.globalVar];
        if (globalData != null) {
          state.data[type] = deepClone(globalData);
        } else {
          state.data[type] = cfg.isList ? (cfg.isKeyed ? Object.fromEntries(cfg.groups.map(g => [g.key, []])) : []) : {};
        }
      });
    }

    // ════════════════════════════════════════════════════════════
    // TABS
    // ════════════════════════════════════════════════════════════
    // Keep per-tab search so "monticello" survives a tab switch and back
    const searchByType = {};
    function switchTab(type) {
      // Warn if there are unsaved edits mid-flight on the current tab
      if (state.editing && !state.isNew) {
        const hasActiveEdit = !!state.editing[TYPES[state.activeType]?.idField];
        if (hasActiveEdit && !confirm('You have an item open in the editor. Switching tabs will discard unsaved edits.\n\nContinue?')) return;
      }
      // Save current search before leaving
      searchByType[state.activeType] = state.search;
      state.activeType = type;
      closeEditor();
      $$('.tab').forEach(b => {
        const on = b.dataset.type === type;
        b.classList.toggle('is-active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        b.setAttribute('aria-current', on ? 'page' : 'false');
      });
      $('#currentTabLabel').textContent = TYPES[type].label;
      $('#listTitle').textContent = TYPES[type].label;
      const cfg = TYPES[type];
      $('#addNewBtn').style.display = cfg.isList ? '' : 'none';
      $('#sortBy').style.display = cfg.isList ? '' : 'none';
      const searchWrap = $('#listSearch')?.parentElement;
      if (searchWrap) searchWrap.style.display = (cfg.isList && cfg.features?.search) ? '' : 'none';
      // Restore this tab's previous search instead of blanking
      state.search = searchByType[type] || '';
      $('#listSearch').value = state.search;
      render();
      renderDirtyIndicator();
      renderTabCounts();
      if (!cfg.isList) openEditor(null, 'Site Info');
    }

    // ── Tab count badges ──
    function renderTabCounts() {
      Object.keys(TYPES).forEach(type => {
        const cfg = TYPES[type];
        const el = document.querySelector(`.tab-count[data-count="${type}"]`);
        if (!el || !cfg.isList) return;
        const data = state.data[type];
        let count = 0;
        if (cfg.isKeyed) count = cfg.groups.reduce((n, g) => n + ((data?.[g.key] || []).length), 0);
        else count = (data || []).length;
        el.textContent = count;
      });
    }

    // ── Stats strip (per tab context) ──
    function renderStatsStrip() {
      const strip = $('#statsStrip');
      if (!strip) return;
      const type = state.activeType;
      const cfg = TYPES[type];
      if (!cfg.isList) { strip.innerHTML = ''; return; }
      const data = state.data[type];
      let stats = [];
      if (type === 'projects') {
        const arr = data || [];
        const ongoing = arr.filter(p => p.status === 'ongoing').length;
        const completed = arr.filter(p => p.status === 'completed').length;
        const featured = arr.filter(p => p.featured).length;
        stats = [
          ['Total', arr.length],
          ['Ongoing', ongoing],
          ['Completed', completed],
          ['Featured', featured]
        ];
      } else if (type === 'awards') {
        stats = [
          ['Industry', (data?.industry || []).length],
          ['Client', (data?.client || []).length]
        ];
      } else if (type === 'activeProjects') {
        const arr = data || [];
        const avg = arr.length ? Math.round(arr.reduce((s,p) => s + (p.progress || 0), 0) / arr.length) : 0;
        stats = [['Live', arr.length], ['Avg Progress', avg + '%']];
      } else {
        const n = (data || []).length;
        stats = [['Items', n], ['Drag', 'to reorder']];
      }
      strip.innerHTML = stats.map(([k,v]) => `<span><span class="stat-num">${v}</span>${k}</span>`).join('');
    }

    // ════════════════════════════════════════════════════════════
    // FLATTEN AWARDS (it's keyed by group → list)
    // ════════════════════════════════════════════════════════════
    function getFlatList(type) {
      const cfg = TYPES[type];
      const data = state.data[type];
      if (!cfg.isList) return [];
      if (!cfg.isKeyed) return (data || []).map((item, idx) => ({ item, idx, group: null }));
      // keyed: awards
      const out = [];
      cfg.groups.forEach(g => {
        (data[g.key] || []).forEach((item, idx) => out.push({ item, idx, group: g.key }));
      });
      return out;
    }

    function updateFlatList(type, flatEntries) {
      // Rebuild data from reordered flat list
      const cfg = TYPES[type];
      if (!cfg.isKeyed) {
        state.data[type] = flatEntries.map(e => e.item);
      } else {
        const groups = Object.fromEntries(cfg.groups.map(g => [g.key, []]));
        flatEntries.forEach(e => groups[e.group].push(e.item));
        state.data[type] = groups;
      }
    }

    // ════════════════════════════════════════════════════════════
    // RENDER LIST
    // ════════════════════════════════════════════════════════════
    function render() {
      const cfg = TYPES[state.activeType];
      const listEl = $('#listContainer');
      const emptyEl = $('#emptyListMsg');
      listEl.innerHTML = '';

      if (!cfg.isList) {
        listEl.innerHTML = `<div class="text-center py-10 text-clay-faint">
          <i class="fas fa-cog text-3xl mb-3"></i>
          <p class="text-sm uppercase tracking-widest">Site-wide settings</p>
          <p class="text-xs mt-1">Edit in the panel on the right.</p>
        </div>`;
        $('#itemCount').textContent = '—';
        emptyEl.classList.add('hidden');
        return;
      }

      let entries = getFlatList(state.activeType);
      const q = state.search.trim().toLowerCase();
      if (q && cfg.features?.search) {
        entries = entries.filter(e => cfg.features.search.some(f => String(e.item[f] || '').toLowerCase().includes(q)));
      }

      // Sort
      if (state.sortBy === 'title') entries.sort((a,b) => String(a.item.title || a.item.name || '').localeCompare(String(b.item.title || b.item.name || '')));
      else if (state.sortBy === 'year-desc') entries.sort((a,b) => String(b.item.year || '').localeCompare(String(a.item.year || '')));
      else if (state.sortBy === 'year-asc') entries.sort((a,b) => String(a.item.year || '').localeCompare(String(b.item.year || '')));
      else if (state.sortBy === 'status') entries.sort((a,b) => String(a.item.status || '').localeCompare(String(b.item.status || '')));

      // Featured pinning for projects
      if (state.activeType === 'projects' && state.sortBy === 'order') {
        entries.sort((a,b) => (b.item.featured ? 1 : 0) - (a.item.featured ? 1 : 0));
      }

      emptyEl.classList.toggle('hidden', entries.length > 0);

      entries.forEach(entry => listEl.appendChild(buildListItem(entry)));
      renderStatsStrip();
      renderTabCounts();
    }

    function buildListItem(entry) {
      const cfg = TYPES[state.activeType];
      const { item, group } = entry;
      const el = document.createElement('div');
      el.className = 'list-item p-3 rounded-sm flex items-center gap-3 bg-white/[0.02]';
      el.dataset.id = item[cfg.idField];
      if (group) el.dataset.group = group;
      el.draggable = !!cfg.features?.reorder;
      if (state.editing && state.editing[cfg.idField] === item[cfg.idField]) el.classList.add('is-editing');

      const handleHTML = cfg.features?.reorder ? `<i class="fas fa-grip-vertical drag-handle text-xs"></i>` : '';

      let label = '';
      let sublabel = '';
      let meta = '';

      if (state.activeType === 'projects') {
        label = item.title;
        sublabel = `${item.client} · ${item.location} · ${item.year}`;
        const catBadge = `<span class="badge badge-${item.category === 'residential' ? 'resi' : item.category === 'commercial' ? 'comm' : 'infra'}">${item.category}</span>`;
        const statusBadge = `<span class="badge badge-${item.status}">${item.status}</span>`;
        const feat = item.featured ? `<span class="badge badge-featured"><i class="fas fa-star text-[8px]"></i> Feat</span>` : '';
        meta = `<div class="flex items-center gap-1 flex-wrap">${feat}${catBadge}${statusBadge}</div>`;
      } else if (state.activeType === 'testimonials') {
        label = item.name;
        sublabel = item.company;
        meta = `<p class="text-[10px] text-clay-faint italic truncate max-w-[14rem]">"${String(item.quote || '').slice(0, 60)}..."</p>`;
      } else if (state.activeType === 'timeline') {
        label = `${item.year} · ${item.title}`;
        sublabel = item.tag;
        meta = `<span class="badge badge-resi"><i class="fas ${item.icon} text-[8px]"></i></span>`;
      } else if (state.activeType === 'awards') {
        label = `${item.year} · ${item.title}`;
        sublabel = item.issuer || item.meta || '';
        meta = `<span class="badge badge-${group === 'industry' ? 'resi' : 'completed'}">${group}</span>`;
      } else if (state.activeType === 'activeProjects') {
        label = item.name;
        sublabel = `${item.location} · ETA ${item.eta}`;
        meta = `<div class="flex items-center gap-2 w-32">
          <div class="flex-1 h-1.5 bg-white/10 rounded-full overflow-hidden"><div class="h-full bg-brand-gold" style="width:${item.progress}%"></div></div>
          <span class="text-[10px] text-brand-gold font-bold">${item.progress}%</span>
        </div>`;
      }

      // Escape HTML for title attrs so quotes in project titles don't break markup
      const esc = (s) => String(s == null ? '' : s).replace(/"/g, '&quot;');
      el.setAttribute('role', 'option');
      el.setAttribute('tabindex', '0');
      el.innerHTML = `
        ${handleHTML}
        <div class="flex-1 min-w-0">
          <div class="font-bold text-sm uppercase truncate" title="${esc(label)}">${label}</div>
          <div class="text-[11px] text-clay-faint truncate mt-0.5" title="${esc(sublabel)}">${sublabel}</div>
        </div>
        <div class="flex items-center gap-2 shrink-0">${meta}</div>
        <button class="btn btn-outline p-1.5 text-[10px] rounded-sm shrink-0" aria-label="Edit ${esc(label)}"><i class="fas fa-pencil-alt"></i></button>
      `;

      el.addEventListener('click', (e) => {
        if (e.target.closest('.drag-handle')) return;
        openEditor(deepClone(item), 'Edit', entry);
      });

      if (cfg.features?.reorder) attachDragHandlers(el, entry);
      return el;
    }

    // ════════════════════════════════════════════════════════════
    // DRAG-AND-DROP REORDER
    // ════════════════════════════════════════════════════════════
    let dragSrc = null;
    function attachDragHandlers(el, entry) {
      el.addEventListener('dragstart', (e) => {
        dragSrc = entry;
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      el.addEventListener('dragend', () => {
        el.classList.remove('dragging');
        $$('.list-item').forEach(i => i.classList.remove('drag-over-top', 'drag-over-bottom'));
      });
      el.addEventListener('dragover', (e) => {
        if (!dragSrc || dragSrc === entry) return;
        e.preventDefault();
        const rect = el.getBoundingClientRect();
        const isAbove = e.clientY < rect.top + rect.height / 2;
        el.classList.toggle('drag-over-top', isAbove);
        el.classList.toggle('drag-over-bottom', !isAbove);
      });
      el.addEventListener('dragleave', () => {
        el.classList.remove('drag-over-top', 'drag-over-bottom');
      });
      el.addEventListener('drop', (e) => {
        e.preventDefault();
        if (!dragSrc || dragSrc === entry) return;
        const rect = el.getBoundingClientRect();
        const isAbove = e.clientY < rect.top + rect.height / 2;
        reorderItems(dragSrc, entry, isAbove);
        dragSrc = null;
      });
    }
    function reorderItems(src, dest, before) {
      const cfg = TYPES[state.activeType];
      pushUndo('Reorder ' + (src.item.title || src.item.name));
      // Awards: reorder only allowed within same group
      if (cfg.isKeyed && src.group !== dest.group) {
        toast('Cannot move between groups', 'warn');
        return;
      }
      let entries = getFlatList(state.activeType);
      entries = entries.filter(e => e.item[cfg.idField] !== src.item[cfg.idField]);
      const destIdx = entries.findIndex(e => e.item[cfg.idField] === dest.item[cfg.idField]);
      const insertAt = before ? destIdx : destIdx + 1;
      entries.splice(insertAt, 0, src);
      updateFlatList(state.activeType, entries);
      markDirty();
      render();
    }

    // ════════════════════════════════════════════════════════════
    // EDITOR
    // ════════════════════════════════════════════════════════════
    function openEditor(item, title = 'Edit', entry = null) {
      const cfg = TYPES[state.activeType];
      state.editing = item || createDefaultItem();
      state.editingEntry = entry;
      state.isNew = !item;
      const singular = cfg.label.replace(/s$/, '');
      const itemName = item ? (item.title || item.name || item.id || 'item') : '';
      $('#formTitle').textContent = state.isNew ? `New ${singular}` : (itemName || 'Editing');
      const crumb = $('#editorCrumb');
      if (crumb) {
        crumb.innerHTML = state.isNew
          ? `<i class="fas fa-plus"></i><span>${cfg.label}</span><i class="fas fa-chevron-right"></i><span>New</span>`
          : `<i class="fas ${cfg.icon}"></i><span>${cfg.label}</span><i class="fas fa-chevron-right"></i><span>Editing</span>`;
      }
      $('#deleteBtn').classList.toggle('hidden', state.isNew || !cfg.isList);
      buildForm();
      renderActiveListHighlight();
      $('.editor-panel').classList.add('is-open');
      $('#editorBackdrop').classList.add('is-open');
      setTimeout(() => $('#itemForm').querySelector('input,select,textarea')?.focus(), 50);
      // Mobile focus trap — cycle tab within the editor drawer so keyboard users can't escape into the list behind
      attachFocusTrap();
    }

    let _trapHandler = null;
    function attachFocusTrap() {
      if (_trapHandler) document.removeEventListener('keydown', _trapHandler);
      const panel = document.querySelector('.editor-panel');
      if (!panel) return;
      _trapHandler = (e) => {
        if (e.key !== 'Tab' || !panel.classList.contains('is-open') || window.innerWidth >= 1024) return;
        const focusable = panel.querySelectorAll('input, select, textarea, button:not([disabled]), [tabindex]:not([tabindex="-1"])');
        if (!focusable.length) return;
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      };
      document.addEventListener('keydown', _trapHandler);
    }
    function detachFocusTrap() {
      if (_trapHandler) { document.removeEventListener('keydown', _trapHandler); _trapHandler = null; }
    }
    function closeEditor() {
      const prevEditingId = state.editing && state.editing[TYPES[state.activeType]?.idField];
      state.editing = null;
      state.editingEntry = null;
      state.isNew = false;
      // Clean up map picker + focus trap (prevents stale fetch + listener leaks)
      teardownMapPicker();
      detachFocusTrap();
      $('.editor-panel').classList.remove('is-open');
      $('#editorBackdrop').classList.remove('is-open');
      $('#formTitle').textContent = 'Select an item or click New';
      const crumb = $('#editorCrumb');
      if (crumb) crumb.innerHTML = '<i class="fas fa-pencil-alt"></i><span>No selection</span>';
      renderActiveListHighlight();
      // Return focus to the previously-edited list item for keyboard continuity
      if (prevEditingId) {
        const item = document.querySelector(`.list-item[data-id="${prevEditingId}"]`);
        if (item) item.focus();
      }
    }
    function renderActiveListHighlight() {
      const activeId = state.editing && state.editing[TYPES[state.activeType].idField];
      $$('.list-item').forEach(el => {
        const on = !!(activeId && el.dataset.id === activeId);
        el.classList.toggle('is-editing', on);
        el.setAttribute('aria-selected', on ? 'true' : 'false');
      });
    }

    function createDefaultItem() {
      const cfg = TYPES[state.activeType];
      if (!cfg.isList) return deepClone(state.data[state.activeType]);
      const item = {};
      cfg.fields.forEach(f => {
        if (f.default) item[f.name] = typeof f.default === 'function' ? f.default() : f.default;
        else if (f.type === 'checkbox') item[f.name] = false;
        else if (f.type === 'slider') item[f.name] = f.default || 50;
      });
      return item;
    }

    // Build form dynamically from schema
    function buildForm() {
      const cfg = TYPES[state.activeType];
      const form = $('#itemForm');
      form.innerHTML = '';
      cfg.fields.forEach(f => form.appendChild(buildField(f, state.editing)));

      // Wire auto-slug — show a "locked" hint when user takes manual control
      cfg.fields.forEach(f => {
        if (f.autoSlug) {
          const srcEl = form.querySelector(`[name="${f.autoSlug}"]`);
          const idEl = form.querySelector(`[name="${f.name}"]`);
          if (srcEl && idEl) {
            // Find the hint <p> Rendered by buildField and reuse it for lock messaging
            const wrap = idEl.closest('div');
            const hintEl = wrap?.querySelector('.text-clay-faint.mt-1');
            const setLockHint = (locked) => {
              if (!hintEl) return;
              if (locked) { hintEl.innerHTML = '<i class="fas fa-lock text-[9px] mr-1"></i>Manual override — no longer auto-syncs from ' + f.autoSlug; hintEl.style.color = '#EFBF04'; }
              else       { hintEl.textContent = 'lowercase, hyphens only — auto-generated from ' + f.autoSlug; hintEl.style.color = ''; }
            };
            srcEl.addEventListener('input', () => {
              if (state.isNew || !idEl.value || idEl.dataset.autoFilled === 'true') {
                idEl.value = slugify(srcEl.value);
                idEl.dataset.autoFilled = 'true';
                setLockHint(false);
              }
            });
            idEl.addEventListener('input', () => {
              if (idEl.dataset.autoFilled !== 'false') { idEl.dataset.autoFilled = 'false'; setLockHint(true); }
            });
          }
        }
      });

      // Initialize map picker if needed
      if (cfg.features?.mapPicker) initMapPicker();
    }

    function buildField(f, data) {
      const wrap = document.createElement('div');
      const val = getPath(data, f.name);
      const required = f.required ? '<span class="text-red-400 ml-0.5">*</span>' : '';
      const hint = f.hint ? `<p class="text-[10px] text-clay-faint mt-1">${f.hint}</p>` : '';
      const errorId = 'err-' + f.name.replace(/\./g, '-');

      if (f.type === 'text' || f.type === 'email' || f.type === 'url' || f.type === 'number') {
        wrap.innerHTML = `
          <label>${f.label}${required}</label>
          <input name="${f.name}" type="${f.type === 'number' ? 'number' : f.type}" class="w-full rounded-sm px-3 py-2"
            ${f.placeholder ? `placeholder="${f.placeholder}"` : ''}
            ${f.pattern ? `pattern="${f.pattern}"` : ''}
            ${f.maxlength ? `maxlength="${f.maxlength}"` : ''}
            ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''}
            ${f.required ? 'data-required="true"' : ''}
            value="${val != null ? String(val).replace(/"/g, '&quot;') : ''}">
          <p class="field-error" id="${errorId}"></p>
          ${hint}`;
      } else if (f.type === 'textarea') {
        wrap.innerHTML = `
          <label>${f.label}${required}</label>
          <textarea name="${f.name}" rows="${f.rows || 3}" class="w-full rounded-sm px-3 py-2 resize-y"
            ${f.placeholder ? `placeholder="${f.placeholder}"` : ''}
            ${f.required ? 'data-required="true"' : ''}>${val != null ? String(val) : ''}</textarea>
          <p class="field-error" id="${errorId}"></p>
          ${hint}`;
      } else if (f.type === 'select') {
        const opts = f.options.map(([v, lbl]) => `<option value="${v}"${val === v ? ' selected' : ''}>${lbl}</option>`).join('');
        wrap.innerHTML = `
          <label>${f.label}${required}</label>
          <select name="${f.name}" class="w-full rounded-sm px-3 py-2" ${f.required ? 'data-required="true"' : ''}>
            <option value="">—</option>${opts}
          </select>
          <p class="field-error" id="${errorId}"></p>`;
      } else if (f.type === 'checkbox') {
        wrap.innerHTML = `
          <label class="flex items-center gap-2 cursor-pointer !normal-case !tracking-normal !text-sm !text-clay-ink">
            <input name="${f.name}" type="checkbox" ${val ? 'checked' : ''} class="accent-brand-gold w-4 h-4">
            ${f.label}
          </label>`;
      } else if (f.type === 'slider') {
        const pct = val != null ? val : f.default || 50;
        wrap.innerHTML = `
          <label>${f.label}${required}: <span id="sliderVal-${f.name}" class="text-brand-gold">${pct}</span>%</label>
          <input name="${f.name}" type="range" min="${f.min || 0}" max="${f.max || 100}" value="${pct}" class="w-full progress-slider">`;
        setTimeout(() => {
          const sl = wrap.querySelector('input');
          const out = wrap.querySelector(`#sliderVal-${f.name}`);
          sl.addEventListener('input', () => out.textContent = sl.value);
        });
      } else if (f.type === 'image') {
        wrap.innerHTML = `
          <label>${f.label}${required}</label>
          <input name="${f.name}" type="text" class="w-full rounded-sm px-3 py-2" placeholder="${f.placeholder || ''}" value="${val != null ? String(val).replace(/"/g, '&quot;') : ''}">
          <div class="img-drop" id="imgDrop-${f.name}">
            <i class="fas fa-image mr-1"></i> Drop image to preview · path is manual
          </div>
          <img class="img-preview${val ? ' is-visible' : ''}" id="imgPrev-${f.name}" src="${val || ''}" alt="preview" onerror="this.classList.remove('is-visible')">`;
        setTimeout(() => wireImagePreview(f.name));
      } else if (f.type === 'coordinates') {
        const coords = Array.isArray(val) ? val : (f.default ? f.default() : [19.0596, 72.8295]);
        wrap.innerHTML = `
          <label>${f.label}${required}</label>
          <div class="flex gap-2">
            <input name="${f.name}_lat" type="number" step="any" class="flex-1 rounded-sm px-3 py-2" placeholder="Latitude" value="${coords[0]}">
            <input name="${f.name}_lng" type="number" step="any" class="flex-1 rounded-sm px-3 py-2" placeholder="Longitude" value="${coords[1]}">
          </div>
          <div class="relative mt-2">
            <input id="geoSearch" type="text" class="w-full rounded-sm px-3 py-2 text-xs" placeholder="Search address (e.g. Bandra, Mumbai)">
            <div id="geoResults" class="absolute z-20 left-0 right-0 mt-1 bg-[#1a1718] border border-white/10 rounded-sm max-h-48 overflow-y-auto hidden"></div>
          </div>
          <div id="pickerMap" class="mt-2"></div>
          <p class="text-[10px] text-clay-faint mt-1">Click map to set · drag marker to adjust · search address above</p>
          <p class="field-error" id="${errorId}"></p>`;
      }
      return wrap;
    }

    // ════════════════════════════════════════════════════════════
    // IMAGE PREVIEW (path input + drop area)
    // ════════════════════════════════════════════════════════════
    function wireImagePreview(fieldName) {
      const input = $(`#itemForm [name="${fieldName}"]`);
      const drop = $(`#imgDrop-${fieldName}`);
      const prev = $(`#imgPrev-${fieldName}`);
      if (!input || !drop || !prev) return;
      input.addEventListener('input', () => {
        if (input.value) { prev.src = input.value; prev.classList.add('is-visible'); }
        else prev.classList.remove('is-visible');
      });
      ['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('is-dragover'); }));
      ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove('is-dragover')));
      drop.addEventListener('drop', (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files?.[0];
        if (!file || !file.type.startsWith('image/')) return toast('Drop an image file', 'error');
        const reader = new FileReader();
        reader.onload = (ev) => { prev.src = ev.target.result; prev.classList.add('is-visible'); toast('Preview loaded — remember to save file to assets/ and update the path manually', 'warn', { duration: 6000 }); };
        reader.readAsDataURL(file);
      });
    }

    // ════════════════════════════════════════════════════════════
    // MAP PICKER (with Nominatim geocoding + context markers)
    // ════════════════════════════════════════════════════════════
    let pickerMap = null, pickerMarker = null, contextLayer = null, geoTimer;
    let geoDocClickHandler = null;
    function teardownMapPicker() {
      clearTimeout(geoTimer);
      if (geoDocClickHandler) { document.removeEventListener('click', geoDocClickHandler); geoDocClickHandler = null; }
      if (contextLayer && pickerMap) { pickerMap.removeLayer(contextLayer); contextLayer = null; }
      if (pickerMap) { pickerMap.remove(); pickerMap = null; pickerMarker = null; }
    }
    function initMapPicker() {
      setTimeout(() => {
        const container = $('#pickerMap');
        if (!container) return;
        teardownMapPicker();
        const lat = parseFloat($('#itemForm [name="coordinates_lat"]').value) || 19.0596;
        const lng = parseFloat($('#itemForm [name="coordinates_lng"]').value) || 72.8295;
        pickerMap = L.map('pickerMap', { zoomControl: true }).setView([lat, lng], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          subdomains: 'abcd', maxZoom: 20,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> · <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(pickerMap);

        // Context: all OTHER projects as faded dots
        contextLayer = L.layerGroup().addTo(pickerMap);
        (state.data.projects || []).forEach(p => {
          if (!p.coordinates || p.id === state.editing?.id) return;
          L.marker(p.coordinates, {
            icon: L.divIcon({ className: 'context-marker', html: '<div class="context-marker-dot"></div>', iconSize: [8,8] }),
            interactive: false
          }).addTo(contextLayer).bindTooltip(p.title, { direction: 'top' });
        });

        pickerMarker = L.marker([lat, lng], { draggable: true }).addTo(pickerMap);
        pickerMarker.on('dragend', () => {
          const { lat, lng } = pickerMarker.getLatLng();
          $('#itemForm [name="coordinates_lat"]').value = lat.toFixed(6);
          $('#itemForm [name="coordinates_lng"]').value = lng.toFixed(6);
        });
        pickerMap.on('click', (e) => {
          pickerMarker.setLatLng(e.latlng);
          $('#itemForm [name="coordinates_lat"]').value = e.latlng.lat.toFixed(6);
          $('#itemForm [name="coordinates_lng"]').value = e.latlng.lng.toFixed(6);
        });

        // Sync fields → map
        ['coordinates_lat','coordinates_lng'].forEach(n => {
          $(`#itemForm [name="${n}"]`)?.addEventListener('change', () => {
            const la = parseFloat($('#itemForm [name="coordinates_lat"]').value);
            const lo = parseFloat($('#itemForm [name="coordinates_lng"]').value);
            if (!isNaN(la) && !isNaN(lo)) { pickerMarker.setLatLng([la, lo]); pickerMap.panTo([la, lo]); }
          });
        });

        // Geocoding search (Nominatim, free)
        const geoInput = $('#geoSearch'), geoResults = $('#geoResults');
        geoInput?.addEventListener('input', () => {
          clearTimeout(geoTimer);
          const q = geoInput.value.trim();
          if (q.length < 3) { geoResults.classList.add('hidden'); return; }
          geoTimer = setTimeout(async () => {
            try {
              const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5&countrycodes=in`);
              const results = await r.json();
              geoResults.innerHTML = '';
              if (!results.length) { geoResults.innerHTML = '<div class="geo-result text-clay-faint">No results</div>'; geoResults.classList.remove('hidden'); return; }
              results.forEach(res => {
                const d = document.createElement('div');
                d.className = 'geo-result';
                d.innerHTML = `<strong>${res.display_name.split(',')[0]}</strong><div class="text-[10px] text-clay-faint truncate">${res.display_name}</div>`;
                d.addEventListener('click', () => {
                  const la = parseFloat(res.lat), lo = parseFloat(res.lon);
                  $('#itemForm [name="coordinates_lat"]').value = la.toFixed(6);
                  $('#itemForm [name="coordinates_lng"]').value = lo.toFixed(6);
                  pickerMarker.setLatLng([la, lo]); pickerMap.setView([la, lo], 15);
                  geoResults.classList.add('hidden');
                  geoInput.value = res.display_name.split(',')[0];
                });
                geoResults.appendChild(d);
              });
              geoResults.classList.remove('hidden');
            } catch (e) { toast('Geocoding failed', 'error'); }
          }, 500);
        });
        // Store handler so it can be removed in teardownMapPicker (prevents listener accumulation)
        geoDocClickHandler = (e) => {
          if (!e.target.closest('#geoSearch') && !e.target.closest('#geoResults')) geoResults?.classList.add('hidden');
        };
        document.addEventListener('click', geoDocClickHandler);

        setTimeout(() => pickerMap.invalidateSize(), 200);
      }, 100);
    }

    // ════════════════════════════════════════════════════════════
    // VALIDATION
    // ════════════════════════════════════════════════════════════
    function validateForm(formData) {
      const cfg = TYPES[state.activeType];
      $$('#itemForm .field-error').forEach(e => e.classList.remove('is-visible'));
      $$('#itemForm .invalid').forEach(e => e.classList.remove('invalid'));
      let firstInvalid = null;

      for (const f of cfg.fields) {
        const val = formData[f.name];
        const showErr = (msg) => {
          const el = $(`#err-${f.name.replace(/\./g, '-')}`);
          const inp = $(`#itemForm [name="${f.name}"]`) || $(`#itemForm [name="${f.name}_lat"]`);
          if (el) { el.textContent = msg; el.classList.add('is-visible'); }
          if (inp) inp.classList.add('invalid');
          if (!firstInvalid) firstInvalid = inp;
        };
        if (f.required && (val == null || val === '' || (Array.isArray(val) && val.length === 0))) { showErr('Required'); continue; }
        if (f.pattern && val && !new RegExp('^' + f.pattern + '$').test(val)) { showErr('Invalid format'); continue; }
        if (f.type === 'email' && val && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) { showErr('Invalid email'); continue; }
        if (f.type === 'coordinates' && Array.isArray(val)) {
          const [la, lo] = val;
          if (isNaN(la) || la < -90 || la > 90) { showErr('Lat must be -90 to 90'); continue; }
          if (isNaN(lo) || lo < -180 || lo > 180) { showErr('Lng must be -180 to 180'); continue; }
        }
      }
      if (firstInvalid) firstInvalid.focus();
      return !firstInvalid;
    }

    // ════════════════════════════════════════════════════════════
    // SUBMIT
    // ════════════════════════════════════════════════════════════
    $('#itemForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const cfg = TYPES[state.activeType];
      const form = e.target;
      const formData = {};
      cfg.fields.forEach(f => {
        if (f.type === 'checkbox') {
          formData[f.name] = form.querySelector(`[name="${f.name}"]`)?.checked || false;
        } else if (f.type === 'coordinates') {
          const la = parseFloat(form.querySelector(`[name="${f.name}_lat"]`)?.value);
          const lo = parseFloat(form.querySelector(`[name="${f.name}_lng"]`)?.value);
          formData[f.name] = [la, lo];
        } else if (f.type === 'number' || f.type === 'slider') {
          const v = form.querySelector(`[name="${f.name}"]`)?.value;
          formData[f.name] = v === '' ? null : Number(v);
        } else {
          formData[f.name] = form.querySelector(`[name="${f.name}"]`)?.value ?? '';
        }
      });

      if (!validateForm(formData)) { toast('Fix errors first', 'error'); return; }

      // ID uniqueness
      if (cfg.isList) {
        const flat = getFlatList(state.activeType);
        const dup = flat.find(e => e.item[cfg.idField] === formData[cfg.idField] && (state.isNew || e.item[cfg.idField] !== state.editing[cfg.idField]));
        if (dup) { toast('ID already exists', 'error'); return; }
      }

      pushUndo(state.isNew ? 'Add ' + (formData.title || formData.name || 'item') : 'Edit ' + (formData.title || formData.name || 'item'));

      if (!cfg.isList) {
        // Site Info: flat object with nested fields
        const next = {};
        cfg.fields.forEach(f => setPath(next, f.name, formData[f.name]));
        state.data[state.activeType] = next;
      } else if (cfg.isKeyed) {
        const group = formData.group;
        if (!cfg.groups.some(g => g.key === group)) {
          toast('Invalid group selection', 'error');
          state.undoStack.pop();
          return;
        }
        const item = { ...formData };
        delete item.group;
        if (!state.isNew) {
          // Find original position + group so we can preserve index when editing (or on same-group re-save)
          let originalIdx = -1, originalGroup = null;
          cfg.groups.forEach(g => {
            const arr = state.data[state.activeType][g.key] || [];
            const idx = arr.findIndex(i => i[cfg.idField] === state.editing[cfg.idField]);
            if (idx !== -1) { originalIdx = idx; originalGroup = g.key; }
          });
          if (originalIdx === -1) {
            toast('Item was deleted elsewhere — saving as new', 'warn');
            state.undoStack.pop(); // rewind, push clean "Add"
            pushUndo('Add ' + (formData.title || formData.name || 'item'));
            (state.data[state.activeType][group] = state.data[state.activeType][group] || []).push(item);
          } else {
            // Remove from original group, then insert — preserving position if same group, else append
            state.data[state.activeType][originalGroup] = state.data[state.activeType][originalGroup].filter(i => i[cfg.idField] !== state.editing[cfg.idField]);
            const target = state.data[state.activeType][group] = state.data[state.activeType][group] || [];
            if (group === originalGroup) target.splice(originalIdx, 0, item);
            else target.push(item);
          }
        } else {
          (state.data[state.activeType][group] = state.data[state.activeType][group] || []).push(item);
        }
      } else {
        if (state.isNew) state.data[state.activeType].push(formData);
        else {
          const idx = state.data[state.activeType].findIndex(i => i[cfg.idField] === state.editing[cfg.idField]);
          if (idx === -1) {
            toast('Item was deleted elsewhere — saving as new', 'warn');
            state.undoStack.pop();
            pushUndo('Add ' + (formData.title || formData.name || 'item'));
            state.data[state.activeType].push(formData);
          } else {
            state.data[state.activeType][idx] = formData;
          }
        }
      }
      markDirty();
      render();
      closeEditor();
      toast('Saved locally — Download to publish', 'success');
    });

    $('#cancelBtn').addEventListener('click', closeEditor);
    $('#editorCloseMobile').addEventListener('click', closeEditor);
    $('#editorBackdrop').addEventListener('click', closeEditor);

    $('#deleteBtn').addEventListener('click', () => {
      const cfg = TYPES[state.activeType];
      const name = state.editing?.title || state.editing?.name || 'this item';
      if (!confirm(`Delete "${name}"?\n\nThis can be undone with Ctrl+Z.`)) return;
      pushUndo('Delete ' + name);
      if (cfg.isKeyed) {
        cfg.groups.forEach(g => {
          state.data[state.activeType][g.key] = (state.data[state.activeType][g.key] || []).filter(i => i[cfg.idField] !== state.editing[cfg.idField]);
        });
      } else {
        state.data[state.activeType] = state.data[state.activeType].filter(i => i[cfg.idField] !== state.editing[cfg.idField]);
      }
      markDirty();
      render();
      closeEditor();
      toast('Deleted — Ctrl+Z to undo', 'info', { action: { label: 'UNDO', onClick: undo } });
    });

    $('#addNewBtn').addEventListener('click', () => openEditor(null, 'New'));

    // ════════════════════════════════════════════════════════════
    // SEARCH + SORT
    // ════════════════════════════════════════════════════════════
    let searchTimer;
    $('#listSearch').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { state.search = e.target.value; searchByType[state.activeType] = state.search; render(); }, 150);
    });
    $('#sortBy').addEventListener('change', (e) => { state.sortBy = e.target.value; render(); });

    // ════════════════════════════════════════════════════════════
    // TAB CLICKS
    // ════════════════════════════════════════════════════════════
    $$('.tab').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.type)));

    // ════════════════════════════════════════════════════════════
    // DOWNLOAD
    // ════════════════════════════════════════════════════════════
    $('#downloadBtn').addEventListener('click', download);
    function download() {
      const cfg = TYPES[state.activeType];
      const body = `/**\n * ${cfg.label} Data — generated by Admin Studio on ${new Date().toISOString()}\n */\nconst ${cfg.constName} = ${JSON.stringify(state.data[state.activeType], null, 2)};\nif (typeof window !== 'undefined') window.${cfg.constName} = ${cfg.constName};\n`;
      const blob = new Blob([body], { type: 'application/javascript' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = cfg.filename; a.click();
      URL.revokeObjectURL(url);
      toast(`Downloaded ${cfg.filename} — replace on server to publish`, 'success', { duration: 6000 });
      clearDirty();
    }

    // ════════════════════════════════════════════════════════════
    // IMPORT (with backup snapshot)
    // ════════════════════════════════════════════════════════════
    $('#importBtn').addEventListener('click', () => $('#importFile').click());
    $('#importFile').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          let text = ev.target.result;
          // Try matching by active type first
          const cfg = TYPES[state.activeType];
          // Tight regex: require word boundary before the const name + terminate at the exact `;\n if (typeof window` sentinel emitted by our download.
          // Falls back to end-of-file if sentinel missing.
          const anchored = new RegExp(`\\bconst\\s+${cfg.constName}\\b\\s*=\\s*([\\s\\S]*?);\\s*(?:if\\s*\\(\\s*typeof\\s+window|$)`);
          const match = text.match(anchored);
          let parsed;
          if (match) {
            // Normalize JS to JSON
            let jsonish = match[1].trim();
            if (jsonish.endsWith(';')) jsonish = jsonish.slice(0, -1);
            jsonish = jsonish.replace(/([{,]\s*)([a-zA-Z_$][\w$]*)(\s*:)/g, '$1"$2"$3').replace(/,(\s*[}\]])/g, '$1').replace(/'/g, '"');
            parsed = JSON.parse(jsonish);
          } else {
            parsed = JSON.parse(text);
          }
          if (!confirm(`Replace all ${cfg.label} with imported data?\n\nYou can Undo with Ctrl+Z.`)) return;
          pushUndo('Import ' + cfg.label);
          state.data[state.activeType] = parsed;
          markDirty();
          render();
          closeEditor();
          toast(`Imported ${Array.isArray(parsed) ? parsed.length : 1} item(s)`, 'success');
        } catch (err) {
          console.error(err);
          toast('Import failed — check file format', 'error');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    // ════════════════════════════════════════════════════════════
    // KEYBOARD SHORTCUTS
    // ════════════════════════════════════════════════════════════
    document.addEventListener('keydown', (e) => {
      const tag = e.target.tagName;
      const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(tag);
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key === 's') { e.preventDefault(); download(); }
      else if (mod && e.key === 'n' && !inField) { e.preventDefault(); openEditor(null, 'New'); }
      else if (mod && e.shiftKey && e.key === 'Z') { e.preventDefault(); redo(); }
      else if (mod && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if (mod && e.key === 'Enter' && inField) { e.preventDefault(); $('#itemForm').dispatchEvent(new Event('submit', { cancelable: true })); }
      else if (e.key === 'Escape') { if (state.editing) closeEditor(); }
    });

    $('#undoBtn').addEventListener('click', undo);
    $('#redoBtn').addEventListener('click', redo);

    // Warn before unload with unsaved changes
    window.addEventListener('beforeunload', (e) => {
      if (state.dirty.size > 0) { e.preventDefault(); e.returnValue = ''; }
    });

    // ════════════════════════════════════════════════════════════
    // PLATFORM-AWARE KEYBOARD HINTS
    // ════════════════════════════════════════════════════════════
    (function platformiseShortcuts() {
      const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform) || /Mac/.test(navigator.userAgent);
      if (!isMac) return; // Ctrl is already in the markup for Windows/Linux
      document.querySelectorAll('.kbd-mod').forEach(el => el.textContent = '⌘');
      document.querySelectorAll('.kbd-mod').forEach(el => {
        // Replace "Ctrl+X" → "⌘X" (no plus sign on mac convention)
        const parent = el.parentElement;
        if (parent && parent.textContent.includes('+')) {
          const letter = parent.textContent.replace('Ctrl+', '').trim();
          parent.textContent = '';
          parent.innerHTML = `<span class="kbd-mod">⌘</span>${letter}`;
        }
      });
    })();

    // ════════════════════════════════════════════════════════════
    // BOOT
    // ════════════════════════════════════════════════════════════
    loadData();
    switchTab('projects');
    if (state.dirty.size > 0) toast('Restored unsaved changes from last session', 'warn', { duration: 5500 });

    // Expose for console debugging
    window._admin = { state, TYPES, download, undo, redo };
  })();
  </script>
</body>
</html>
