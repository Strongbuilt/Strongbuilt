<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificates · Floating Drift</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>

  <link rel="stylesheet" href="theme.css">

  <style>
    body { background: var(--bg); color: var(--fg); padding: 0 0 5rem; }
    .page-container { max-width: 1680px; margin-inline: auto; padding-inline: clamp(1.25rem, 4vw, 3rem); position: relative; z-index: 1; }

    .page-header { padding: clamp(3rem,6vw,5rem) 0 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 3rem; }
    .page-header .eyebrow { font-family: var(--font-label); font-size: 0.72rem; font-weight: 600; color: var(--accent); letter-spacing: 0.32em; text-transform: uppercase; margin-bottom: 1rem; }
    .page-header h1 { font-family: var(--font-display); font-size: clamp(2rem,4vw,3rem); font-weight: 600; text-transform: uppercase; margin: 0 0 1rem; }
    .page-header h1 em { color: var(--accent); font-style: italic; font-weight: 500; }
    .page-header p { color: var(--fg-muted); max-width: 42rem; margin: 0 0 2rem; line-height: 1.6; }

    .opt { padding: clamp(2rem,4vw,4rem) 0; }
    .opt-head { display: flex; align-items: baseline; gap: 1.5rem; margin-bottom: 2.5rem; flex-wrap: wrap; }
    .opt-num { font-family: var(--font-display); font-size: 2.25rem; font-weight: 400; color: var(--accent); line-height: 1; }
    .opt-title { font-family: var(--font-heading); font-size: 1.15rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; margin: 0; }
    .opt-desc { color: var(--fg-muted); font-size: 0.9rem; max-width: 48rem; line-height: 1.6; margin: 0; flex-basis: 100%; }

    /* Floating Drift — flat, no border, float only */
    .d16 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.5rem; }
    @media (max-width: 1024px) { .d16 { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 540px) { .d16 { grid-template-columns: repeat(2, 1fr); } }
    .d16-card { aspect-ratio: 4/5.2; display: grid; place-items: center; padding: 0.9rem; animation: d16-float 6s ease-in-out infinite; animation-delay: calc(var(--i,0) * 400ms); }
    @keyframes d16-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    .d16-card img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .page-footer { padding: 3rem 0 2rem; border-top: 1px solid var(--border); text-align: center; color: var(--fg-subtle); font-family: var(--font-label); font-size: 0.75rem; letter-spacing: 0.24em; text-transform: uppercase; margin-top: 3rem; }
  </style>
</head>
<body>

  <div class="md-orb" style="top:-180px; left:8%; width:480px; height:480px;"></div>
  <div class="md-orb" style="top:40%; right:-120px; width:420px; height:420px;"></div>

  <main class="page-container">

    <header class="page-header">
      <div class="eyebrow">Certificates · Selected Design</div>
      <h1>Floating <em>drift.</em></h1>
      <p>Every certificate gently bobs up and down with a staggered tilt. Hover any card — it pauses, grows, and an amber glow appears behind it with the label fading in. Alive but quiet.</p>
    </header>

    <section class="opt" id="opt-16">
      <div class="d16">
        <article class="d16-card" style="--i:0"><img decoding="async" src="assets/certificates/optimized/ISO 9001.png" alt="ISO 9001:2015"></article>
        <article class="d16-card" style="--i:1"><img decoding="async" src="assets/certificates/optimized/ISO 14001.png" alt="ISO 14001:2015"></article>
        <article class="d16-card" style="--i:2"><img decoding="async" src="assets/certificates/optimized/ISO 45001.png" alt="ISO 45001:2018"></article>
        <article class="d16-card" style="--i:3"><img decoding="async" src="assets/certificates/optimized/ohsas 18001.jpg" alt="OHSAS 18001:2007"></article>
        <article class="d16-card" style="--i:4"><img decoding="async" src="assets/certificates/optimized/ISO900120015.png" alt="ISO 9001:2015 Archive"></article>
      </div>
    </section>

    <footer class="page-footer">
      Confirm to wire into recognition.html
    </footer>
  </main>

</body>
</html>
