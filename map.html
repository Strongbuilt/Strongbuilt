    <style>
        .sidebar-optimized { background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-right: 1px solid rgba(255,255,255,0.08); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(239, 191, 4,0.3); border-radius: 2px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #EFBF04; }

        /* ─────── Tcard-style popup ─────── */
        .leaflet-popup-content-wrapper {
            background: linear-gradient(155deg, rgba(42, 38, 39, 0.97), rgba(20, 18, 19, 0.97));
            color: #EEEEEE;
            border: 1px solid rgba(239, 191, 4,0.35);
            border-radius: 6px;
            backdrop-filter: blur(14px);
            padding: 0;
            overflow: hidden;
            box-shadow: 0 20px 50px -10px rgba(0,0,0,0.7), 0 0 30px -10px rgba(239, 191, 4,0.25);
            position: relative;
        }
        .leaflet-popup-content-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, #EFBF04, transparent);
            z-index: 5;
        }
        .leaflet-popup-content { margin: 0; width: 300px !important; }
        .leaflet-popup-tip { background: rgba(20, 18, 19, 0.97); border: 1px solid rgba(239, 191, 4,0.3); }
        .leaflet-container a.leaflet-popup-close-button {
            color: #EEEEEE;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(239, 191, 4,0.3);
            border-radius: 50%;
            top: 10px; right: 10px;
            width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center;
            font: 16px/14px Tahoma, Verdana, sans-serif;
            text-shadow: none;
            transition: all 0.3s ease;
            z-index: 10;
        }
        .leaflet-container a.leaflet-popup-close-button:hover { color: #1a1718; background: #EFBF04; transform: rotate(90deg); }

        .popup-image { width: 100%; height: 150px; object-fit: cover; transition: transform 0.7s ease; }
        .leaflet-popup:hover .popup-image { transform: scale(1.06); }
        .popup-header { overflow: hidden; position: relative; height: 150px; background: #1a1718; }
        .popup-header::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(20,18,19,0.85) 100%);
            pointer-events: none;
        }
        .popup-icon-badge {
            position: absolute;
            bottom: -20px;
            left: 18px;
            z-index: 3;
            width: 44px; height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(239, 191, 4, 0.28), rgba(239, 191, 4, 0.06) 70%);
            border: 1px solid rgba(239, 191, 4, 0.5);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #EFBF04;
            font-size: 1.1rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 4px 16px -4px rgba(239, 191, 4,0.5);
        }
        .popup-content { padding: 32px 20px 20px; position: relative; }
        .popup-kicker {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: #EFBF04;
            margin-bottom: 0.5rem;
        }
        .popup-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            text-transform: uppercase;
            color: #EEEEEE;
            letter-spacing: 0.02em;
            line-height: 1.15;
            margin-bottom: 0.5rem;
        }
        .popup-client {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            color: #AAAAAA;
            font-weight: 300;
            margin-bottom: 1rem;
        }
        .popup-meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin: 1rem 0;
            padding: 0.75rem 0;
            border-top: 1px solid rgba(239, 191, 4, 0.2);
            border-bottom: 1px solid rgba(239, 191, 4, 0.2);
        }
        .popup-meta-k {
            display: block;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.55rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #EFBF04;
            margin-bottom: 0.25rem;
        }
        .popup-meta-v {
            display: block;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: #EEEEEE;
        }
        .popup-badges { display: flex; gap: 0.4rem; margin-bottom: 0.85rem; flex-wrap: wrap; }
        .popup-badge {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 999px;
        }
        .popup-badge-cat { background: rgba(239, 191, 4, 0.15); color: #EFBF04; border: 1px solid rgba(239, 191, 4, 0.3); }
        .popup-badge-loc { color: #AAAAAA; border: 1px solid rgba(255,255,255,0.1); }
        .popup-badge-live { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.35); }
        .popup-badge-live::before {
            content: '';
            display: inline-block;
            width: 5px; height: 5px;
            background: #4ade80;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
            animation: popup-dot 2s ease infinite;
            box-shadow: 0 0 8px #4ade80;
        }
        .popup-badge-done { color: #AAAAAA; border: 1px solid rgba(255,255,255,0.1); }
        @keyframes popup-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .popup-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.65rem 1rem;
            background: linear-gradient(155deg, #EFBF04, #EFBF04);
            color: #1a1718 !important;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 3px;
            transition: all 0.35s ease;
        }
        .popup-cta:hover { box-shadow: 0 8px 24px -4px rgba(239, 191, 4, 0.5); transform: translateY(-2px); }

        /* ─────── SVG Teardrop Pin ─────── */
        .sb-pin { background: transparent !important; border: none !important; cursor: pointer; }
        .sb-pin svg { width: 36px; height: 44px; display: block; transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
        .sb-pin:hover svg { transform: scale(1.15) translateY(-3px); }
        .sb-pin.is-active svg { transform: scale(1.2) translateY(-4px); filter: drop-shadow(0 8px 14px rgba(239, 191, 4,0.6)); }
        .sb-pin.is-active .sb-pin-ring { opacity: 1; animation: pinPulse 1.8s ease-in-out infinite; }
        .sb-pin-ring { opacity: 0; transform-origin: center; }
        @keyframes pinPulse {
            0%, 100% { r: 4; opacity: 0.9; }
            50% { r: 14; opacity: 0; }
        }

        /* ─────── Marker Cluster (Strong Built style) ─────── */
        .sb-cluster {
            background: transparent !important;
            border: none !important;
        }
        .sb-cluster > div {
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 30% 30%, #EFBF04, #EFBF04 70%);
            border: 2px solid rgba(255,255,255,0.85);
            color: #1a1718;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: -0.01em;
            box-shadow: 0 6px 18px -4px rgba(0,0,0,0.6), 0 0 0 6px rgba(239, 191, 4,0.18);
            transition: transform 0.35s ease;
        }
        .sb-cluster:hover > div { transform: scale(1.08); }
        .sb-cluster-xl > div { width: 52px; height: 52px; font-size: 1.05rem; }
        .leaflet-cluster-anim .leaflet-marker-icon, .leaflet-cluster-anim .leaflet-marker-shadow {
            transition: transform 0.4s ease-out, opacity 0.3s ease-in;
        }

        /* ─────── Project card ─────── */
        .filter-btn-map.active { background-color: #EFBF04 !important; color: #1a1718 !important; border-color: #EFBF04 !important; }
        .status-btn.active { background-color: #EFBF04 !important; color: #1a1718 !important; border-color: #EFBF04 !important; }
        .loc-filter.active { background-color: #EFBF04; color: #1a1718; border-color: #EFBF04; }

        .project-card { opacity: 0; transform: translateY(15px); animation: cardIn 0.4s cubic-bezier(0.16,1,0.3,1) forwards; }
        @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
        .project-card.is-selected { border-color: #EFBF04 !important; background: rgba(239, 191, 4,0.08); box-shadow: 0 0 24px -4px rgba(239, 191, 4,0.25); }
        .project-card.is-selected .card-accent { transform: translateX(0) !important; }
        .project-card:focus-visible { outline: 2px solid #EFBF04; outline-offset: 2px; border-radius: 4px; }

        #projectSearch:focus { border-color: #EFBF04; box-shadow: 0 0 0 2px rgba(239, 191, 4,0.2); }

        /* ─────── Filter chip bar ─────── */
        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 3px 8px 3px 10px;
            background: rgba(239, 191, 4, 0.12);
            border: 1px solid rgba(239, 191, 4, 0.35);
            color: #EFBF04;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .filter-chip:hover { background: rgba(239, 191, 4, 0.22); border-color: #EFBF04; }
        .filter-chip i { font-size: 0.5rem; opacity: 0.7; }
        .filter-chip:hover i { opacity: 1; }

        /* ─────── Mobile Map/List toggle ─────── */
        .m-toggle { display: none; }
        @media (max-width: 767px) {
            .m-toggle {
                display: flex;
                position: fixed;
                bottom: 1rem; left: 50%;
                transform: translateX(-50%);
                z-index: 30;
                gap: 4px;
                padding: 4px;
                background: rgba(10, 10, 10, 0.92);
                border: 1px solid rgba(239, 191, 4, 0.3);
                border-radius: 999px;
                backdrop-filter: blur(12px);
                box-shadow: 0 10px 30px -6px rgba(0,0,0,0.7);
            }
            .m-toggle button {
                font-family: 'Barlow Condensed', sans-serif;
                font-weight: 700;
                font-size: 0.7rem;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                padding: 0.5rem 1.1rem;
                border-radius: 999px;
                color: #AAAAAA;
                transition: all 0.3s ease;
                display: inline-flex; align-items: center; gap: 0.4rem;
            }
            .m-toggle button.is-on {
                background: linear-gradient(155deg, #EFBF04, #EFBF04);
                color: #1a1718;
            }
            /* Mobile: show only one panel at a time, full-screen */
            .main-layout { flex-direction: column; }
            .map-sidebar {
                max-height: none !important;
                width: 100%;
                height: calc(100vh - 5rem);
                position: absolute;
                inset: 0;
                z-index: 15;
            }
            .map-canvas {
                width: 100%;
                height: calc(100vh - 5rem);
                position: absolute;
                inset: 0;
                z-index: 10;
            }
            .main-layout[data-view="map"] .map-sidebar { display: none; }
            .main-layout[data-view="list"] .map-canvas { visibility: hidden; }
        }
    </style>
</head>

                        Showing <span id="resultCount" class="text-brand-darkGold font-bold">0</span> of <span id="totalCount" class="text-clay-ink">0</span>
                    </p>
                    <button id="clearFilters" class="hidden text-[9px] text-clay-muted hover:text-brand-darkGold transition uppercase tracking-wider font-heading font-bold">Clear <i class="fas fa-times ml-1"></i></button>
                </div>
            </div>

            <!-- Applied filter chips -->
            <div id="filterChips" class="px-3 md:px-4 pt-3 flex flex-wrap gap-1.5 shrink-0"></div>

            <div class="flex-grow overflow-y-auto custom-scrollbar p-3 md:p-4 space-y-2 md:space-y-3" id="listings"></div>

            <!-- Legend -->
            <div class="p-3 md:p-4 border-t border-clay-border shrink-0 bg-clay-base/40">
                <p class="text-[10px] text-clay-faint font-heading uppercase tracking-widest mb-2">Legend</p>
                <div class="flex gap-3 md:gap-4 flex-wrap">
                    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#EFBF04] border border-clay-border shrink-0"></span><span class="text-[10px] text-clay-muted">Residential</span></div>
                    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#FF8C00] border border-clay-border shrink-0"></span><span class="text-[10px] text-clay-muted">Commercial</span></div>
                    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#C0C0C0] border border-clay-border shrink-0"></span><span class="text-[10px] text-clay-muted">Infra</span></div>
                </div>
            </div>
        </div>

        <!-- Map -->
        <div id='map' class="map-canvas w-full md:w-2/3 lg:w-3/4 flex-grow md:h-full bg-[#1a1a1a] relative z-0 min-h-[400px]"></div>
    </div>

    <script src="projects-data.js"></script>
    <script>
        // Guard against missing data file
        if (typeof PROJECT_DATA === 'undefined' || !Array.isArray(PROJECT_DATA)) {
            console.error('PROJECT_DATA not loaded. Check projects-data.js');
            document.getElementById('listings').innerHTML = '<div class="p-4 text-clay-faint text-sm">Unable to load project data. Please refresh the page.</div>';
            throw new Error('PROJECT_DATA missing');
        }

        // ─── Category palette + icons ───
        const CATEGORY_COLORS = { residential: '#EFBF04', commercial: '#FF8C00', infrastructure: '#C0C0C0' };
        const CATEGORY_ICONS  = { residential: 'fa-home', commercial: 'fa-city', infrastructure: 'fa-road' };
        const getCategoryColor = c => CATEGORY_COLORS[c] || CATEGORY_COLORS.residential;
        const getCategoryIcon  = c => CATEGORY_ICONS[c]  || 'fa-building';

        // ─── Filter state (seeded from URL) ───
        const initialParams = new URLSearchParams(location.search);
        const filters = {
            category: initialParams.get('category') || 'all',
            location: initialParams.get('location') || 'all',
            status:   initialParams.get('status')   || 'all',
            search:   initialParams.get('q') || ''
        };

        // ─── Stats header ───
        document.getElementById('total-projects').textContent = PROJECT_DATA.length;
        document.getElementById('total-cities').textContent   = new Set(PROJECT_DATA.map(p => p.location)).size;
        document.getElementById('totalCount').textContent      = PROJECT_DATA.length;

        // ─── Location filter pills ───
        const locs = ['all', ...new Set(PROJECT_DATA.map(p => p.location))].sort();
        const locCont = document.getElementById('locationFilterMap');
        locs.forEach(loc => {
            const btn = document.createElement('button');
            btn.className = 'loc-filter py-1 px-2.5 text-[9px] uppercase font-bold tracking-wider border rounded-sm transition-all duration-300 border-clay-border text-clay-faint hover:border-brand-gold/50 hover:text-clay-muted';
            btn.textContent = loc === 'all' ? 'All Cities' : loc;
            btn.dataset.location = loc;
            btn.setAttribute('aria-pressed', 'false');
            btn.addEventListener('click', () => { filters.location = loc; syncUI(); renderProjects(); });
            locCont.appendChild(btn);
        });

        // ─── Leaflet Map ───
        const map = L.map('map', { zoomControl: false, center: [19.1, 72.9], zoom: 11 });
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd',
            maxZoom: 20,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        // ─── Cluster group (Strong Built style) ───
        const cluster = L.markerClusterGroup({
            maxClusterRadius: 50,
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false,
            iconCreateFunction: (c) => {
                const n = c.getChildCount();
                const size = n >= 10 ? ' sb-cluster-xl' : '';
                return L.divIcon({
                    html: `<div>${n}</div>`,
                    className: 'sb-cluster' + size,
                    iconSize: L.point(44, 44)
                });
            }
        });
        map.addLayer(cluster);

        // ─── SVG Teardrop Pin ───
        function getIcon(cat, isActive = false) {
            const core = getCategoryColor(cat);
            const html = `<svg viewBox="0 0 36 44" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="pinG" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#EFBF04"/>
                        <stop offset="1" stop-color="#EFBF04"/>
                    </linearGradient>
                </defs>
                <circle class="sb-pin-ring" cx="18" cy="16" r="4" fill="none" stroke="#EFBF04" stroke-width="2"/>
                <path d="M18 2 C9.2 2 2 9.2 2 18 c0 12 16 24 16 24 s16-12 16-24 C34 9.2 26.8 2 18 2 z" fill="url(#pinG)" stroke="#fff" stroke-width="1.5"/>
                <circle cx="18" cy="16" r="6" fill="${core}" stroke="#1a1718" stroke-width="1.5"/>
            </svg>`;
            return L.divIcon({
                className: 'sb-pin' + (isActive ? ' is-active' : ''),
                html,
                iconSize: [36, 44], iconAnchor: [18, 42], popupAnchor: [0, -38]
            });
        }

        // ─── Popup (tcard style) ───
        function buildPopupHTML(p) {
            const img = p.img
                ? `<img src="${p.img}" alt="${p.title}" class="popup-image" loading="lazy">`
                : `<div class="h-full w-full flex items-center justify-center text-clay-muted"><i class="fas fa-building text-4xl opacity-40"></i></div>`;
            const statusBadge = p.status === 'ongoing'
                ? `<span class="popup-badge popup-badge-live">Ongoing</span>`
                : `<span class="popup-badge popup-badge-done">Completed</span>`;
            return `<article class="popup-card">
                <div class="popup-header">${img}</div>
                <div class="popup-icon-badge"><i class="fas ${getCategoryIcon(p.category)}"></i></div>
                <div class="popup-content">
                    <div class="popup-kicker">${p.category} &middot; ${p.year}</div>
                    <h3 class="popup-title">${p.title}</h3>
                    <p class="popup-client">${p.client}</p>
                    <div class="popup-badges">
                        <span class="popup-badge popup-badge-cat">${p.category}</span>
                        <span class="popup-badge popup-badge-loc">${p.location}</span>
                        ${statusBadge}
                    </div>
                    <div class="popup-meta-grid">
                        <div><span class="popup-meta-k">Year</span><span class="popup-meta-v">${p.year}</span></div>
                        <div><span class="popup-meta-k">Area</span><span class="popup-meta-v">${p.area}</span></div>
                    </div>
                    <a href="projects.html" class="popup-cta"><i class="fas fa-arrow-right text-[0.6rem]"></i> View Project</a>
                </div>
            </article>`;
        }

        let markers = [];
        const markerMap = new Map();
        const listEl = document.getElementById('listings');
        const searchInput = document.getElementById('projectSearch');
        const resultCountEl = document.getElementById('resultCount');
        const clearBtn = document.getElementById('clearFilters');
        const chipBar = document.getElementById('filterChips');

        // ─── Filtering ───
        function getFiltered() {
            const q = filters.search.trim().toLowerCase();
            return PROJECT_DATA.filter(p => {
                if (filters.category !== 'all' && p.category !== filters.category) return false;
                if (filters.location !== 'all' && p.location !== filters.location) return false;
                if (filters.status !== 'all' && p.status !== filters.status) return false;
                if (q && !(p.title.toLowerCase().includes(q) || p.client.toLowerCase().includes(q) || p.location.toLowerCase().includes(q))) return false;
                return true;
            });
        }
        const hasActiveFilters = () => filters.category !== 'all' || filters.location !== 'all' || filters.status !== 'all' || filters.search.trim() !== '';

        // ─── URL sync ───
        function updateURL() {
            const p = new URLSearchParams();
            if (filters.category !== 'all') p.set('category', filters.category);
            if (filters.location !== 'all') p.set('location', filters.location);
            if (filters.status !== 'all')   p.set('status', filters.status);
            if (filters.search.trim())      p.set('q', filters.search.trim());
            const qs = p.toString();
            history.replaceState(null, '', qs ? '?' + qs : location.pathname);
        }

        // ─── Filter chips bar ───
        function renderChips() {
            chipBar.innerHTML = '';
            const chips = [];
            if (filters.category !== 'all') chips.push({ label: filters.category, key: 'category' });
            if (filters.location !== 'all') chips.push({ label: filters.location, key: 'location' });
            if (filters.status !== 'all')   chips.push({ label: filters.status, key: 'status' });
            if (filters.search.trim())      chips.push({ label: `"${filters.search.trim()}"`, key: 'search' });
            chips.forEach(c => {
                const el = document.createElement('button');
                el.className = 'filter-chip';
                el.innerHTML = `${c.label} <i class="fas fa-times"></i>`;
                el.setAttribute('aria-label', `Remove ${c.label} filter`);
                el.addEventListener('click', () => {
                    if (c.key === 'search') { filters.search = ''; searchInput.value = ''; }
                    else filters[c.key] = 'all';
                    syncUI(); renderProjects();
                });
                chipBar.appendChild(el);
            });
        }

        // ─── UI state sync (buttons + chips + URL) ───
        function syncUI() {
            // Category
            document.querySelectorAll('.filter-btn-map').forEach(b => {
                const on = b.dataset.filter === filters.category;
                b.classList.toggle('active', on);
                b.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
            // Status
            document.querySelectorAll('.status-btn').forEach(b => {
                const on = b.dataset.status === filters.status;
                b.classList.toggle('active', on);
                b.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
            // Locations
            document.querySelectorAll('.loc-filter').forEach(b => {
                const on = b.dataset.location === filters.location;
                b.classList.toggle('active', on);
                b.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
            clearBtn.classList.toggle('hidden', !hasActiveFilters());
            renderChips();
            updateURL();
        }

        // ─── Selection ───
        function selectProject(p, item) {
            map.flyTo(p.coordinates, 15, { duration: 1.1 });
            const marker = markerMap.get(p.id);
            if (marker) {
                markers.forEach(m => m.setIcon(getIcon(m._category, false)));
                marker.setIcon(getIcon(p.category, true));
                cluster.zoomToShowLayer(marker, () => marker.openPopup());
            }
            document.querySelectorAll('.project-card').forEach(d => d.classList.remove('is-selected'));
            if (item) item.classList.add('is-selected');
            // Mobile: switching selection from list → jump to map view
            const layout = document.querySelector('.main-layout');
            if (layout && window.innerWidth < 768) setView('map');
        }

        // ─── Render ───
        function renderProjects() {
            // Teardown
            cluster.clearLayers();
            markers = [];
            markerMap.clear();
            listEl.innerHTML = '';

            const filtered = getFiltered();
            resultCountEl.textContent = filtered.length;

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-12 px-4">
                        <i class="fas fa-search text-3xl text-gray-700 mb-3 block"></i>
                        <p class="text-clay-muted text-sm font-heading uppercase tracking-wider mb-2">No Results</p>
                        <p class="text-clay-muted text-xs font-light">Try adjusting filters or search</p>
                    </div>`;
                return;
            }

            const bounds = L.latLngBounds();

            filtered.forEach((p, i) => {
                if (!p.coordinates || p.coordinates.length !== 2) return;
                const marker = L.marker(p.coordinates, { icon: getIcon(p.category) }).bindPopup(buildPopupHTML(p), { closeButton: true, maxWidth: 320 });
                marker._category = p.category;
                marker._projectId = p.id;
                cluster.addLayer(marker);
                markers.push(marker);
                markerMap.set(p.id, marker);
                bounds.extend(p.coordinates);

                // List card
                const item = document.createElement('div');
                item.className = 'project-card p-3 bg-clay-surface/10 border border-clay-border hover:border-brand-gold/50 cursor-pointer transition-all duration-300 rounded-sm group hover:bg-clay-surface/20 relative overflow-hidden flex items-center gap-3';
                item.style.animationDelay = Math.min(i * 35, 800) + 'ms';
                item.setAttribute('tabindex', '0');
                item.setAttribute('role', 'button');
                item.setAttribute('aria-label', `View ${p.title} on map`);

                const thumb = p.img
                    ? `<img src="${p.img}" class="w-12 h-12 object-cover rounded-sm border border-clay-border group-hover:border-brand-gold/50 transition-colors shrink-0" alt="${p.title}" loading="lazy">`
                    : `<div class="w-12 h-12 bg-clay-surface/10 rounded-sm flex items-center justify-center border border-clay-border shrink-0"><i class="fas fa-building text-clay-muted text-xs"></i></div>`;
                const dotC = getCategoryColor(p.category);
                const featuredStar = p.featured ? '<i class="fas fa-star text-brand-darkGold text-[8px] mr-1" title="Featured"></i>' : '';

                item.innerHTML = `
                    <div class="card-accent absolute left-0 top-0 w-1 h-full bg-brand-gold transform -translate-x-full group-hover:translate-x-0 transition-transform duration-300"></div>
                    ${thumb}
                    <div class="flex-grow min-w-0">
                        <div class="flex justify-between items-start gap-2">
                            <h3 class="text-clay-ink font-bold font-heading uppercase text-xs truncate group-hover:text-brand-darkGold transition-colors tracking-wide">${featuredStar}${p.title}</h3>
                            <span class="text-[9px] text-brand-darkGold uppercase tracking-wider whitespace-nowrap shrink-0">${p.location}</span>
                        </div>
                        <p class="text-clay-muted text-[10px] font-body truncate mt-0.5">${p.client}</p>
                        <div class="flex items-center gap-2 mt-1.5 flex-wrap">
                            <span class="inline-flex items-center gap-1 text-[9px] text-clay-muted uppercase tracking-wider">
                                <span class="w-2 h-2 rounded-full shrink-0" style="background:${dotC}"></span>${p.category}
                            </span>
                            <span class="text-[9px] text-clay-faint">&middot;</span>
                            <span class="text-[9px] text-clay-muted font-body">${p.year}</span>
                            <span class="text-[9px] text-clay-faint">&middot;</span>
                            <span class="text-[9px] text-clay-muted font-body">${p.area}</span>
                            ${p.status === 'ongoing' ? '<span class="text-[9px] text-clay-faint">&middot;</span><span class="text-[9px] text-green-400 uppercase tracking-wider font-bold"><span class="inline-block w-1.5 h-1.5 bg-green-400 rounded-full mr-1 animate-pulse"></span>Ongoing</span>' : ''}
                        </div>
                    </div>`;
                item.addEventListener('click', () => selectProject(p, item));
                item.addEventListener('keydown', e => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectProject(p, item); }
                });
                listEl.appendChild(item);
            });

            if (bounds.isValid()) map.fitBounds(bounds, { padding: [50, 50], maxZoom: 12 });
        }

        // ─── Bindings ───
        document.querySelectorAll('.filter-btn-map').forEach(btn => {
            btn.addEventListener('click', () => { filters.category = btn.dataset.filter; syncUI(); renderProjects(); });
        });
        document.querySelectorAll('.status-btn').forEach(btn => {
            btn.addEventListener('click', () => { filters.status = btn.dataset.status; syncUI(); renderProjects(); });
        });

        let searchTimer;
        searchInput.value = filters.search;
        searchInput.addEventListener('input', e => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                filters.search = e.target.value;
                syncUI(); renderProjects();
            }, 200);
        });

        clearBtn.addEventListener('click', () => {
            filters.category = 'all'; filters.location = 'all'; filters.status = 'all'; filters.search = '';
            searchInput.value = '';
            syncUI(); renderProjects();
        });

        // ─── Mobile Map/List toggle ───
        function setView(v) {
            const layout = document.querySelector('.main-layout');
            if (!layout) return;
            layout.setAttribute('data-view', v);
            document.querySelectorAll('.m-toggle button').forEach(b => {
                const on = b.dataset.view === v;
                b.classList.toggle('is-on', on);
                b.setAttribute('aria-selected', on ? 'true' : 'false');
            });
            if (v === 'map') setTimeout(() => map.invalidateSize(), 100);
        }
        document.querySelectorAll('.m-toggle button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

        // ─── Clear selection on popup close ───
        map.on('popupclose', () => {
            markers.forEach(m => m.setIcon(getIcon(m._category, false)));
            document.querySelectorAll('.project-card').forEach(d => d.classList.remove('is-selected'));
        });

        // ─── Initial paint ───
        syncUI();
        renderProjects();
    </script>
    <script src="script.js"></script>
</body>

</html>
