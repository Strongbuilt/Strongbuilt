    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        .sidebar-optimized { background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-right: 1px solid rgba(255,255,255,0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #000; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #BF953F; }

        .leaflet-popup-content-wrapper { background: rgba(10,10,10,0.95); color: #fff; border: 1px solid rgba(191,149,63,0.3); border-radius: 4px; backdrop-filter: blur(10px); padding: 0; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .leaflet-popup-content { margin: 0; width: 280px !important; }
        .leaflet-popup-tip { background: rgba(10,10,10,0.95); border: 1px solid rgba(191,149,63,0.3); }
        .leaflet-container a.leaflet-popup-close-button { color: #fff; background: rgba(0,0,0,0.5); border-radius: 50%; top: 8px; right: 8px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font: 16px/14px Tahoma, Verdana, sans-serif; text-shadow: none; transition: all 0.3s ease; z-index: 10; }
        .leaflet-container a.leaflet-popup-close-button:hover { color: #BF953F; background: rgba(0,0,0,0.9); transform: rotate(90deg); }

        .marker-icon { background: transparent !important; border: none !important; transition: none !important; }
        .marker-inner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px rgba(191,149,63,0.6); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s ease; }
        .marker-icon:hover .marker-inner { transform: scale(1.5); box-shadow: 0 0 20px rgba(191,149,63,1); }
        .popup-image { width: 100%; height: 160px; object-fit: cover; border-bottom: 1px solid rgba(255,255,255,0.1); transition: transform 0.5s ease; }
        .leaflet-popup:hover .popup-image { transform: scale(1.05); }
        .popup-header { overflow: hidden; position: relative; height: 160px; }
        .popup-content { padding: 20px; position: relative; }
        .filter-btn-map.active { background-color: #BF953F; color: black; border-color: #BF953F; }
    </style>
</head>

<body class="bg-black antialiased overflow-hidden selection:bg-brand-gold selection:text-black h-screen flex flex-col">

    <!-- NAVIGATION OVERLAY -->
    <div id="navOverlay" class="nav-overlay">
        <div id="navBackdrop" class="nav-overlay-backdrop"></div>
        <div class="nav-overlay-content p-6 md:p-12">
            <div class="flex justify-between items-center mb-16">
                <img src="assets/Logo/Strongbuilt.png" alt="Strong Built" class="h-18 w-auto">
                <button id="closeMenuBtn" class="text-gray-400 hover:text-white transition text-3xl"><i class="fas fa-times"></i></button>
            </div>
            <ul class="space-y-6">
                <li><a href="index.html" class="sidebar-link">Home</a></li>
                <li><button class="sidebar-dropdown-btn" onclick="toggleSidebarInternal(this)"><span>About</span> <i class="fas fa-chevron-down"></i></button><div class="sidebar-submenu"><a href="story.html" class="sidebar-sublink">Our Story</a><a href="leadership.html" class="sidebar-sublink">Leadership</a></div></li>
                <li><a href="projects.html" class="sidebar-link">Projects</a></li>
                <li><a href="services.html" class="sidebar-link">Services</a></li>
                <li><a href="careers.html" class="sidebar-link">Careers</a></li>
                <li><button class="sidebar-dropdown-btn" onclick="toggleSidebarInternal(this)"><span>Insights</span> <i class="fas fa-chevron-down"></i></button><div class="sidebar-submenu"><a href="updates.html" class="sidebar-sublink">News & Press</a><a href="blog.html" class="sidebar-sublink">Blog</a><a href="resources.html" class="sidebar-sublink">Resources</a></div></li>
                <li><a href="contact.html" class="sidebar-link">Contact</a></li>
            </ul>
            <div class="mt-auto pt-12 border-t border-white/10">
                <p class="text-brand-gold font-heading text-sm mb-4">Connect With Us</p>
                <div class="flex gap-6 text-xl">
                    <a href="https://www.linkedin.com/company/strongbuilt" target="_blank" rel="noopener" aria-label="LinkedIn" class="text-gray-400 hover:text-brand-gold transition"><i class="fab fa-linkedin"></i></a>
                    <a href="https://www.instagram.com/strongbuilt" target="_blank" rel="noopener" aria-label="Instagram" class="text-gray-400 hover:text-brand-gold transition"><i class="fab fa-instagram"></i></a>
                    <a href="https://x.com/strongbuilt" target="_blank" rel="noopener" aria-label="Twitter" class="text-gray-400 hover:text-brand-gold transition"><i class="fab fa-twitter"></i></a>
                </div>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="w-full z-50 transition-all duration-300 glass-header flex-shrink-0" id="mainHeader">
        <div class="container mx-auto px-6 h-24 flex items-center justify-between">
            <a href="index.html" class="flex items-center group relative z-50">
                <img src="assets/Logo/Strongbuilt.png" alt="Strong Built Logo" class="h-24 w-auto object-contain transition duration-300 hover:opacity-90">
            </a>
            <div class="flex items-center">
                <button id="menuToggle" class="menu-btn group"><div class="menu-icon"><span></span><span></span><span></span></div></button>
            </div>
        </div>
    </header>

    <!-- MAIN LAYOUT: Sidebar + Map -->
    <div class="flex-grow flex flex-col md:flex-row h-full overflow-hidden">
        <!-- Sidebar -->
        <div class="w-full md:w-1/3 lg:w-1/4 sidebar-optimized flex flex-col relative z-20">
            <div class="p-6 pb-4 border-b border-white/10 shrink-0 bg-black/40">
                <img src="assets/Logo/Strongbuilt.png" alt="Strong Built" class="h-14 w-auto">
                <h2 class="text-6xl font-bold text-white mb-1 uppercase font-heading tracking-tight"><span>Project</span> <span class="text-brand-gold">Locations</span></h2>
                <div class="flex gap-4 mt-4 text-xs font-heading tracking-widest text-gray-400">
                    <div><span class="block text-xl text-white font-bold" id="total-projects">0</span><span>Projects</span></div>
                    <div class="w-px bg-white/10"></div>
                    <div><span class="block text-xl text-white font-bold" id="total-cities">0</span><span>Cities</span></div>
                </div>

                <!-- Category Filters -->
                <div class="flex gap-2 mt-6">
                    <button class="filter-btn-map active flex-1 py-2 text-[10px] uppercase font-bold tracking-wider border border-brand-gold bg-brand-gold text-black transition-all duration-300 rounded-sm" data-filter="all">All</button>
                    <button class="filter-btn-map flex-1 py-2 text-[10px] uppercase font-bold tracking-wider border border-white/10 text-gray-400 hover:border-brand-gold hover:text-brand-gold transition-all duration-300 rounded-sm" data-filter="residential">Resi</button>
                    <button class="filter-btn-map flex-1 py-2 text-[10px] uppercase font-bold tracking-wider border border-white/10 text-gray-400 hover:border-brand-gold hover:text-brand-gold transition-all duration-300 rounded-sm" data-filter="commercial">Comm</button>
                </div>

                <!-- Location Filters -->
                <div class="flex flex-wrap gap-1.5 mt-3" id="locationFilterMap"></div>
            </div>

            <div class="flex-grow overflow-y-auto custom-scrollbar p-4 space-y-3" id="listings"></div>

            <!-- Legend -->
            <div class="p-4 border-t border-white/10 shrink-0 bg-black/40">
                <p class="text-[10px] text-gray-500 font-heading uppercase tracking-widest mb-2">Legend</p>
                <div class="flex gap-4">
                    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#FFD700] border border-white shrink-0"></span><span class="text-[10px] text-gray-400">Residential</span></div>
                    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#FF8C00] border border-white shrink-0"></span><span class="text-[10px] text-gray-400">Commercial</span></div>
                    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#C0C0C0] border border-white shrink-0"></span><span class="text-[10px] text-gray-400">Infra</span></div>
                </div>
            </div>
        </div>

        <!-- Map -->
        <div id='map' class="w-full md:w-2/3 lg:w-3/4 h-full bg-[#1a1a1a] relative z-0"></div>
    </div>

    <script src="projects-data.js"></script>
    <script>
        let activeCategory = 'all';
        let activeLocation = 'all';

        const allCities = new Set(PROJECT_DATA.map(p => p.location)).size;
        document.getElementById('total-projects').textContent = PROJECT_DATA.length;
        document.getElementById('total-cities').textContent = allCities;

        // Build location filter buttons
        const locs = ['all', ...new Set(PROJECT_DATA.map(p => p.location))].sort();
        const locCont = document.getElementById('locationFilterMap');
        locs.forEach(loc => {
            const btn = document.createElement('button');
            const active = loc === 'all';
            btn.className = 'loc-filter py-1 px-2.5 text-[9px] uppercase font-bold tracking-wider border rounded-sm transition-all duration-300 ' + (active ? 'border-brand-gold bg-brand-gold text-black' : 'border-white/10 text-gray-500 hover:border-brand-gold/50 hover:text-gray-300');
            btn.textContent = loc === 'all' ? 'All Cities' : loc;
            btn.dataset.location = loc;
            btn.addEventListener('click', () => {
                activeLocation = loc;
                locCont.querySelectorAll('.loc-filter').forEach(b => { b.className = b.className.replace(/border-brand-gold bg-brand-gold text-black/g, 'border-white/10 text-gray-500'); });
                btn.className = btn.className.replace(/border-white\/10 text-gray-500/g, 'border-brand-gold bg-brand-gold text-black');
                renderProjects();
            });
            locCont.appendChild(btn);
        });

        // Leaflet Map
        const map = L.map('map', { zoomControl: false, center: [19.1, 72.9], zoom: 11, attributionControl: false });
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { subdomains: 'abcd', maxZoom: 20 }).addTo(map);

        function getIcon(cat) {
            const c = { residential: '#FFD700', commercial: '#FF8C00', infrastructure: '#C0C0C0' }[cat] || '#FFD700';
            return L.divIcon({ className: 'marker-icon', html: '<div class="marker-inner" style="background-color:' + c + ';"></div>', iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -10] });
        }

        let markers = [];
        const listEl = document.getElementById('listings');

        function renderProjects() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            listEl.innerHTML = '';

            const filtered = PROJECT_DATA.filter(p => {
                if (activeCategory !== 'all' && p.category !== activeCategory) return false;
                if (activeLocation !== 'all' && p.location !== activeLocation) return false;
                return true;
            });

            const bounds = L.latLngBounds();

            filtered.forEach(p => {
                const marker = L.marker(p.coordinates, { icon: getIcon(p.category) }).addTo(map).bindPopup(`
                    <div class="font-heading popup-card"><div class="popup-header">${p.img ? `<img src="${p.img}" alt="${p.title}" class="popup-image">` : `<div class="h-full w-full bg-gray-900 flex items-center justify-center text-gray-700"><i class="fas fa-building text-4xl opacity-50"></i></div>`}</div>
                    <div class="popup-content"><h3 class="font-bold text-brand-gold uppercase tracking-widest text-lg mb-1 leading-none">${p.title}</h3><p class="text-xs text-white mb-3 font-light tracking-wide"><span class="text-gray-500">Client:</span> ${p.client}</p>
                    <div class="flex items-center gap-2 mb-4"><span class="text-[9px] text-black bg-brand-gold px-2 py-0.5 rounded-sm font-bold uppercase tracking-wider">${p.category}</span><span class="text-[9px] text-gray-400 border border-white/10 px-2 py-0.5 rounded-sm font-bold uppercase tracking-wider">${p.location}</span></div>
                    <a href="projects.html" class="block text-center w-full py-2 border border-brand-gold/30 text-brand-gold text-[10px] font-bold uppercase tracking-[0.2em] hover:bg-brand-gold hover:text-black transition-all duration-300 rounded-sm">View Details</a></div></div>`);
                markers.push(marker);
                bounds.extend(p.coordinates);

                const item = document.createElement('div');
                item.className = 'project-card p-3 bg-white/10 border border-white/10 hover:border-brand-gold/50 cursor-pointer transition-all duration-300 rounded-sm group hover:bg-white/20 relative overflow-hidden flex items-center gap-3';
                const thumb = p.img ? `<img src="${p.img}" class="w-12 h-12 object-cover rounded-sm border border-white/20 group-hover:border-brand-gold/50 transition-colors" alt="${p.title}">` : `<div class="w-12 h-12 bg-white/10 rounded-sm flex items-center justify-center border border-white/20"><i class="fas fa-building text-gray-400 text-xs"></i></div>`;
                const dotC = { residential: '#FFD700', commercial: '#FF8C00', infrastructure: '#C0C0C0' }[p.category] || '#FFD700';

                item.innerHTML = `<div class="absolute left-0 top-0 w-1 h-full bg-brand-gold transform -translate-x-full group-hover:translate-x-0 transition-transform duration-300"></div>${thumb}<div class="flex-grow min-w-0"><div class="flex justify-between items-start"><h3 class="text-white font-bold font-heading uppercase text-xs truncate group-hover:text-brand-gold transition-colors tracking-wide">${p.title}</h3><span class="text-[9px] text-brand-gold uppercase tracking-wider whitespace-nowrap ml-2">${p.location}</span></div><p class="text-gray-300 text-[10px] font-body truncate mt-0.5">${p.client}</p><div class="flex items-center gap-1.5 mt-1"><span class="w-2 h-2 rounded-full shrink-0" style="background:${dotC}"></span><span class="text-[9px] text-gray-400 uppercase tracking-wider">${p.category}</span></div></div>`;

                item.addEventListener('click', () => {
                    map.flyTo(p.coordinates, 15, { duration: 1.5 });
                    marker.openPopup();
                    document.querySelectorAll('.project-card').forEach(d => d.classList.remove('border-brand-gold'));
                    item.classList.add('border-brand-gold');
                });
                listEl.appendChild(item);
            });

            if (markers.length > 0) map.fitBounds(bounds, { padding: [50, 50], maxZoom: 12 });
            gsap.from(".project-card", { y: 20, opacity: 0, duration: 0.4, stagger: 0.05, ease: "power2.out", clearProps: "all" });
        }

        renderProjects();

        document.querySelectorAll('.filter-btn-map').forEach(btn => {
            btn.addEventListener('click', e => {
                document.querySelectorAll('.filter-btn-map').forEach(b => { b.classList.remove('active', 'bg-brand-gold', 'text-black', 'border-brand-gold'); b.classList.add('text-gray-400', 'border-white/10'); });
                e.target.classList.add('active', 'bg-brand-gold', 'text-black', 'border-brand-gold');
                e.target.classList.remove('text-gray-400', 'border-white/10');
                activeCategory = e.target.getAttribute('data-filter');
                renderProjects();
            });
        });
    </script>
    <script src="script.js"></script>
</body>
