    <style>
        .sidebar-optimized { background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-right: 1px solid rgba(255,255,255,0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background:#F5EEDC; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #C8900F; }

        .leaflet-popup-content-wrapper { background: rgba(10,10,10,0.95); color: #f5f1ec; border: 1px solid rgba(200,144,15,0.3); border-radius: 4px; backdrop-filter: blur(10px); padding: 0; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .leaflet-popup-content { margin: 0; width: 280px !important; }
        .leaflet-popup-tip { background: rgba(10,10,10,0.95); border: 1px solid rgba(200,144,15,0.3); }
        .leaflet-container a.leaflet-popup-close-button { color: #f5f1ec; background: rgba(0,0,0,0.5); border-radius: 50%; top: 8px; right: 8px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font: 16px/14px Tahoma, Verdana, sans-serif; text-shadow: none; transition: all 0.3s ease; z-index: 10; }
        .leaflet-container a.leaflet-popup-close-button:hover { color: #C8900F; background: rgba(0,0,0,0.9); transform: rotate(90deg); }

        .marker-icon { background: transparent !important; border: none !important; transition: none !important; }
        .marker-inner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px rgba(200,144,15,0.6); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s ease; }
        .marker-icon:hover .marker-inner { transform: scale(1.5); box-shadow: 0 0 20px rgba(200,144,15,1); }

        /* Active/selected marker — pulsing ring */
        .marker-icon.is-active .marker-inner { transform: scale(1.4); box-shadow: 0 0 25px rgba(200,144,15,1); animation: markerPulse 1.5s ease-in-out infinite; }
        @keyframes markerPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(200,144,15,0.8), 0 0 25px rgba(200,144,15,1); }
            50% { box-shadow: 0 0 0 10px rgba(200,144,15,0), 0 0 25px rgba(200,144,15,1); }
        }

        .popup-image { width: 100%; height: 160px; object-fit: cover; border-bottom: 1px solid rgba(255,255,255,0.1); transition: transform 0.5s ease; }
        .leaflet-popup:hover .popup-image { transform: scale(1.05); }
        .popup-header { overflow: hidden; position: relative; height: 160px; }
        .popup-content { padding: 20px; position: relative; }
        .filter-btn-map.active { background-color: #C8900F; color: black; border-color: #C8900F; }

        /* Card enter animation (replaces GSAP) */
        .project-card { opacity: 0; transform: translateY(15px); animation: cardIn 0.4s cubic-bezier(0.16,1,0.3,1) forwards; }
        @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
        .project-card.is-selected { border-color: #C8900F !important; background: rgba(200,144,15,0.08); box-shadow: 0 0 20px rgba(200,144,15,0.15); }
        .project-card.is-selected .card-accent { transform: translateX(0) !important; }

        /* Search input focus ring */
        #projectSearch:focus { border-color: #C8900F; box-shadow: 0 0 0 2px rgba(200,144,15,0.2); }
    </style>

    <script>
        // Guard against missing data file
        if (typeof PROJECT_DATA === 'undefined' || !Array.isArray(PROJECT_DATA)) {
            console.error('PROJECT_DATA not loaded. Check projects-data.js');
            document.getElementById('listings').innerHTML = '<div class="p-4 text-clay-faint text-sm">Unable to load project data. Please refresh the page.</div>';
            throw new Error('PROJECT_DATA missing');
        }

        // Category color palette — single source of truth
        const CATEGORY_COLORS = {
            residential: '#FCB615',
            commercial: '#FF8C00',
            infrastructure: '#C0C0C0'
        };
        const getCategoryColor = cat => CATEGORY_COLORS[cat] || CATEGORY_COLORS.residential;

        // Filter state
        const filters = { category: 'all', location: 'all', status: 'all', search: '' };

        // Populate overall stats
        document.getElementById('total-projects').textContent = PROJECT_DATA.length;
        document.getElementById('total-cities').textContent = new Set(PROJECT_DATA.map(p => p.location)).size;
        document.getElementById('totalCount').textContent = PROJECT_DATA.length;

        // Build location filter buttons
        const locs = ['all', ...new Set(PROJECT_DATA.map(p => p.location))].sort();
        const locCont = document.getElementById('locationFilterMap');
        locs.forEach(loc => {
            const btn = document.createElement('button');
            const active = loc === 'all';
            btn.className = 'loc-filter py-1 px-2.5 text-[9px] uppercase font-bold tracking-wider border rounded-sm transition-all duration-300 ' + (active ? 'border-brand-gold bg-brand-gold text-black' : 'border-clay-border text-clay-faint hover:border-brand-gold/50 hover:text-clay-muted');
            btn.textContent = loc === 'all' ? 'All Cities' : loc;
            btn.dataset.location = loc;
            btn.setAttribute('aria-pressed', active ? 'true' : 'false');
            btn.addEventListener('click', () => {
                filters.location = loc;
                locCont.querySelectorAll('.loc-filter').forEach(b => {
                    b.className = b.className.replace(/border-brand-gold bg-brand-gold text-black/g, 'border-clay-border text-clay-faint');
                    b.setAttribute('aria-pressed', 'false');
                });
                btn.className = btn.className.replace(/border-clay-border\/10 text-clay-faint/g, 'border-brand-gold bg-brand-gold text-black');
                btn.setAttribute('aria-pressed', 'true');
                renderProjects();
            });
            locCont.appendChild(btn);
        });

        // Leaflet Map
        const map = L.map('map', { zoomControl: false, center: [19.1, 72.9], zoom: 11, attributionControl: false });
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { subdomains: 'abcd', maxZoom: 20 }).addTo(map);

        function getIcon(cat, isActive = false) {
            const c = getCategoryColor(cat);
            return L.divIcon({
                className: 'marker-icon' + (isActive ? ' is-active' : ''),
                html: '<div class="marker-inner" style="background-color:' + c + ';"></div>',
                iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -10]
            });
        }

        // Popup HTML extracted for readability
        function buildPopupHTML(p) {
            const img = p.img
                ? `<img src="${p.img}" alt="${p.title}" class="popup-image" loading="lazy">`
                : `<div class="h-full w-full bg-clay-surface flex items-center justify-center text-gray-700"><i class="fas fa-building text-4xl opacity-50"></i></div>`;
            const statusBadge = p.status === 'ongoing'
                ? `<span class="text-[9px] bg-green-500/20 text-green-400 border border-green-500/30 px-2 py-0.5 rounded-sm font-bold uppercase tracking-wider"><span class="inline-block w-1.5 h-1.5 bg-green-400 rounded-full mr-1 align-middle animate-pulse"></span>Ongoing</span>`
                : `<span class="text-[9px] text-clay-muted border border-clay-border px-2 py-0.5 rounded-sm font-bold uppercase tracking-wider">Completed</span>`;
            return `<div class="font-heading popup-card">
                <div class="popup-header">${img}</div>
                <div class="popup-content">
                    <h3 class="font-bold text-brand-darkGold uppercase tracking-widest text-lg mb-1 leading-none">${p.title}</h3>
                    <p class="text-xs text-clay-ink mb-3 font-light tracking-wide"><span class="text-clay-faint">Client:</span> ${p.client}</p>
                    <div class="flex items-center gap-2 mb-3 flex-wrap">
                        <span class="text-[9px] text-black bg-brand-gold px-2 py-0.5 rounded-sm font-bold uppercase tracking-wider">${p.category}</span>
                        <span class="text-[9px] text-clay-muted border border-clay-border px-2 py-0.5 rounded-sm font-bold uppercase tracking-wider">${p.location}</span>
                        ${statusBadge}
                    </div>
                    <div class="grid grid-cols-2 gap-2 mb-4 pt-3 border-t border-clay-border">
                        <div><span class="block text-[9px] text-clay-faint uppercase tracking-wider">Year</span><span class="text-clay-ink text-sm font-bold">${p.year}</span></div>
                        <div><span class="block text-[9px] text-clay-faint uppercase tracking-wider">Area</span><span class="text-clay-ink text-sm font-bold">${p.area}</span></div>
                    </div>
                    <a href="projects.html" class="block text-center w-full py-2 border border-brand-gold/30 text-brand-darkGold text-[10px] font-bold uppercase tracking-[0.2em] hover:bg-brand-gold hover:text-black transition-all duration-300 rounded-sm">View Details</a>
                </div>
            </div>`;
        }

        let markers = [];
        let markerMap = new Map(); // project id -> marker
        const listEl = document.getElementById('listings');
        const searchInput = document.getElementById('projectSearch');
        const resultCountEl = document.getElementById('resultCount');
        const clearBtn = document.getElementById('clearFilters');

        function getFiltered() {
            const q = filters.search.trim().toLowerCase();
            return PROJECT_DATA.filter(p => {
                if (filters.category !== 'all' && p.category !== filters.category) return false;
                if (filters.location !== 'all' && p.location !== filters.location) return false;
                if (filters.status !== 'all' && p.status !== filters.status) return false;
                if (q && !(p.title.toLowerCase().includes(q) || p.client.toLowerCase().includes(q) || p.location.toLowerCase().includes(q))) return false;
                return true;
            });
        }

        function hasActiveFilters() {
            return filters.category !== 'all' || filters.location !== 'all' || filters.status !== 'all' || filters.search.trim() !== '';
        }

        function selectProject(p, item) {
            map.flyTo(p.coordinates, 15, { duration: 1.2 });
            const marker = markerMap.get(p.id);
            if (marker) {
                // Re-create icon with active state
                markers.forEach(m => m.setIcon(getIcon(m._category, false)));
                marker.setIcon(getIcon(p.category, true));
                marker.openPopup();
            }
            document.querySelectorAll('.project-card').forEach(d => d.classList.remove('is-selected'));
            if (item) item.classList.add('is-selected');
        }

        function renderProjects() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            markerMap.clear();
            listEl.innerHTML = '';

            const filtered = getFiltered();
            resultCountEl.textContent = filtered.length;
            clearBtn.classList.toggle('hidden', !hasActiveFilters());

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-12 px-4">
                        <i class="fas fa-search text-3xl text-gray-700 mb-3 block"></i>
                        <p class="text-clay-muted text-sm font-heading uppercase tracking-wider mb-2">No Results</p>
                        <p class="text-clay-muted text-xs font-light">Try adjusting your filters or search</p>
                    </div>`;
                return;
            }

            const bounds = L.latLngBounds();

            filtered.forEach((p, i) => {
                const marker = L.marker(p.coordinates, { icon: getIcon(p.category) }).addTo(map).bindPopup(buildPopupHTML(p));
                marker._category = p.category;
                markers.push(marker);
                markerMap.set(p.id, marker);
                bounds.extend(p.coordinates);

                const item = document.createElement('div');
                item.className = 'project-card p-3 bg-clay-surface/10 border border-clay-border hover:border-brand-gold/50 cursor-pointer transition-all duration-300 rounded-sm group hover:bg-clay-surface/20 relative overflow-hidden flex items-center gap-3';
                item.style.animationDelay = Math.min(i * 40, 800) + 'ms';
                item.setAttribute('tabindex', '0');
                item.setAttribute('role', 'button');
                item.setAttribute('aria-label', `View ${p.title} on map`);

                const thumb = p.img
                    ? `<img src="${p.img}" class="w-12 h-12 object-cover rounded-sm border border-clay-border group-hover:border-brand-gold/50 transition-colors shrink-0" alt="${p.title}" loading="lazy">`
                    : `<div class="w-12 h-12 bg-clay-surface/10 rounded-sm flex items-center justify-center border border-clay-border shrink-0"><i class="fas fa-building text-clay-muted text-xs"></i></div>`;
                const dotC = getCategoryColor(p.category);
                const statusDot = p.status === 'ongoing'
                    ? '<span class="inline-block w-1.5 h-1.5 bg-green-400 rounded-full mr-1 animate-pulse"></span>'
                    : '';
                const featuredStar = p.featured ? '<i class="fas fa-star text-brand-darkGold text-[8px] mr-1" title="Featured"></i>' : '';

                item.innerHTML = `
                    <div class="card-accent absolute left-0 top-0 w-1 h-full bg-brand-gold transform -translate-x-full group-hover:translate-x-0 transition-transform duration-300"></div>
                    ${thumb}
                    <div class="flex-grow min-w-0">
                        <div class="flex justify-between items-start gap-2">
                            <h3 class="text-clay-ink font-bold font-heading uppercase text-xs truncate group-hover:text-brand-darkGold transition-colors tracking-wide">${featuredStar}${p.title}</h3>
                            <span class="text-[9px] text-brand-darkGold uppercase tracking-wider whitespace-nowrap shrink-0">${p.location}</span>
                        </div>
                        <p class="text-clay-muted text-[10px] font-body truncate mt-0.5">${p.client}</p>
                        <div class="flex items-center gap-2 mt-1.5 flex-wrap">
                            <span class="inline-flex items-center gap-1 text-[9px] text-clay-muted uppercase tracking-wider">
                                <span class="w-2 h-2 rounded-full shrink-0" style="background:${dotC}"></span>${p.category}
                            </span>
                            <span class="text-[9px] text-clay-faint">•</span>
                            <span class="text-[9px] text-clay-muted font-body">${p.year}</span>
                            <span class="text-[9px] text-clay-faint">•</span>
                            <span class="text-[9px] text-clay-muted font-body">${p.area}</span>
                            ${p.status === 'ongoing' ? '<span class="text-[9px] text-clay-faint">•</span><span class="text-[9px] text-green-400 uppercase tracking-wider font-bold">' + statusDot + 'Ongoing</span>' : ''}
                        </div>
                    </div>`;

                item.addEventListener('click', () => selectProject(p, item));
                item.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectProject(p, item); }
                });
                listEl.appendChild(item);
            });

            if (markers.length > 0) map.fitBounds(bounds, { padding: [50, 50], maxZoom: 12 });
        }

        // Initial render
        renderProjects();

        // Category filter buttons
        document.querySelectorAll('.filter-btn-map').forEach(btn => {
            btn.addEventListener('click', e => {
                document.querySelectorAll('.filter-btn-map').forEach(b => {
                    b.classList.remove('active', 'bg-brand-gold', 'text-black', 'border-brand-gold');
                    b.classList.add('text-clay-muted', 'border-clay-border');
                    b.setAttribute('aria-pressed', 'false');
                });
                e.target.classList.add('active', 'bg-brand-gold', 'text-black', 'border-brand-gold');
                e.target.classList.remove('text-clay-muted', 'border-clay-border');
                e.target.setAttribute('aria-pressed', 'true');
                filters.category = e.target.getAttribute('data-filter');
                renderProjects();
            });
        });

        // Status filter buttons
        document.querySelectorAll('.status-btn').forEach(btn => {
            btn.addEventListener('click', e => {
                document.querySelectorAll('.status-btn').forEach(b => {
                    b.classList.remove('active', 'bg-brand-gold', 'text-black', 'border-brand-gold');
                    b.classList.add('text-clay-muted', 'border-clay-border');
                    b.setAttribute('aria-pressed', 'false');
                });
                e.target.classList.add('active', 'bg-brand-gold', 'text-black', 'border-brand-gold');
                e.target.classList.remove('text-clay-muted', 'border-clay-border');
                e.target.setAttribute('aria-pressed', 'true');
                filters.status = e.target.getAttribute('data-status');
                renderProjects();
            });
        });

        // Search input (debounced)
        let searchTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                filters.search = e.target.value;
                renderProjects();
            }, 200);
        });

        // Clear filters
        clearBtn.addEventListener('click', () => {
            filters.category = 'all';
            filters.location = 'all';
            filters.status = 'all';
            filters.search = '';
            searchInput.value = '';

            // Reset all filter UI
            document.querySelectorAll('.filter-btn-map').forEach(b => {
                const isAll = b.dataset.filter === 'all';
                b.classList.toggle('active', isAll);
                b.classList.toggle('bg-brand-gold', isAll);
                b.classList.toggle('text-black', isAll);
                b.classList.toggle('border-brand-gold', isAll);
                b.classList.toggle('text-clay-muted', !isAll);
                b.classList.toggle('border-clay-border', !isAll);
                b.setAttribute('aria-pressed', isAll ? 'true' : 'false');
            });
            document.querySelectorAll('.status-btn').forEach(b => {
                const isAll = b.dataset.status === 'all';
                b.classList.toggle('active', isAll);
                b.classList.toggle('bg-brand-gold', isAll);
                b.classList.toggle('text-black', isAll);
                b.classList.toggle('border-brand-gold', isAll);
                b.classList.toggle('text-clay-muted', !isAll);
                b.classList.toggle('border-clay-border', !isAll);
                b.setAttribute('aria-pressed', isAll ? 'true' : 'false');
            });
            document.querySelectorAll('.loc-filter').forEach(b => {
                const isAll = b.dataset.location === 'all';
                if (isAll) {
                    b.className = b.className.replace(/border-clay-border\/10 text-clay-faint/g, 'border-brand-gold bg-brand-gold text-black');
                } else {
                    b.className = b.className.replace(/border-brand-gold bg-brand-gold text-black/g, 'border-clay-border text-clay-faint');
                }
                b.setAttribute('aria-pressed', isAll ? 'true' : 'false');
            });
            renderProjects();
        });

        // Clear active marker state when popup closes
        map.on('popupclose', () => {
            markers.forEach(m => m.setIcon(getIcon(m._category, false)));
            document.querySelectorAll('.project-card').forEach(d => d.classList.remove('is-selected'));
        });
    </script>
    <script src="script.js"></script>
</body>

</html>
